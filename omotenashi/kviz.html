<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9091c">
<meta name="description" content="Toyota Way Challenge: 30 kérdéses, párosan is játszható, önálló tanulási kvíz.">
<title>Toyota Way Challenge – Omotenashi Manager</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f4f5f6;--red:#d9091c;--line:#dce0e4;--muted:#5d646c}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a{touch-action:manipulation}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #1765b0;outline-offset:3px}
header{background:white;border-top:5px solid var(--red);border-bottom:1px solid var(--line)}
.head{max-width:780px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:18px;font-weight:800;color:var(--red)}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
.back{color:#30363b;text-decoration:none;border:1px solid #bfc6cd;padding:10px 12px;border-radius:8px;font-size:13px;white-space:nowrap;background:#fff}
main{max-width:780px;margin:0 auto;padding:22px 18px 52px}
h1{font-size:30px;letter-spacing:-.6px;line-height:1.12;margin:12px 0 14px}
h2{font-size:21px;line-height:1.3;margin:0 0 12px}h3{font-size:16px;line-height:1.4;margin:0 0 8px}
p{line-height:1.55}.eyebrow{font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:19px;margin:14px 0}
.intro{color:#525a63}.muted{color:var(--muted);font-size:13px;line-height:1.5}
label.field{display:block;font-size:15px;font-weight:700;margin:16px 0}
input[type=text],select{display:block;width:100%;font-size:16px;min-height:47px;padding:11px;border:1px solid #aab3bc;border-radius:8px;background:#fff;color:#202124;margin-top:7px}
.primary,.secondary,.light{border:0;border-radius:8px;min-height:48px;padding:12px 16px;line-height:1.3;font-weight:700}
.primary{background:var(--red);color:#fff}.secondary{background:#e8ebee;color:#202124}.light{background:#fff;color:#202124;border:1px solid #b9c2ca}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions>*{flex:1;min-width:135px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pill{border-radius:999px;border:1px solid #d6dbe0;background:#fff;padding:6px 10px;font-size:12px}
.progress{height:9px;background:#e9ecf0;border-radius:99px;overflow:hidden;margin:11px 0 16px}.progress>div{height:100%;background:var(--red);transition:width .15s}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid #d8dde2;background:#fff;color:#202124;border-radius:11px;padding:16px 15px;margin:10px 0;line-height:1.4;min-height:65px;font-size:16px}
.option.selected{border-color:var(--red);background:#fff2f3}.letter{flex:none;font-weight:800;color:var(--red);min-width:23px}
.map{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:12px 0}
.map button{border:1px solid #c4ccd2;border-radius:6px;background:#fff;color:#263039;min-height:34px;padding:0;font-size:12px}
.map button.done{background:#e9f3ed;border-color:#87b69a}.map button.current{border:2px solid var(--red);font-weight:800}
.warning{background:#fff7e4;border-left:4px solid #d88900;border-radius:4px;padding:12px 14px;line-height:1.5;margin:15px 0}
.notice{background:#f2f4f7;border-radius:9px;padding:13px 15px;font-size:14px;line-height:1.5}
.search{display:inline-block;margin:5px 0 8px;color:#124a81;font-weight:700;text-decoration:underline}
.score{font-size:clamp(36px,9vw,58px);font-weight:900;letter-spacing:-1.5px;color:var(--red);margin:8px 0}
.rating{font-size:20px;font-weight:800;line-height:1.35}.review{border-top:1px solid var(--line);padding:18px 0}.review:first-child{border-top:0}
.review h3{font-size:16px}.correct{color:#11683b;font-weight:800}.wrong{color:#a31c29;font-weight:800}
.answerline{padding:8px 10px;border-radius:6px;background:#f3f5f6;margin:7px 0;font-size:14px;line-height:1.45}
.explanation{line-height:1.55;font-size:14px;color:#40474e;margin:10px 0}
.small{font-size:12px;color:var(--muted)}footer{margin:22px 0;color:var(--muted);font-size:12px;line-height:1.5}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:12px 16px;border-radius:9px;z-index:10;max-width:calc(100vw - 24px);box-shadow:0 4px 18px #0004}
.hidden{display:none!important}
@media(max-width:420px){main{padding:16px 13px 45px}.head{padding:13px}.brand{font-size:16px}.back{font-size:12px}h1{font-size:27px}.panel{padding:15px}.map{grid-template-columns:repeat(6,minmax(0,1fr))}.actions>*{min-width:115px}}
@media print{header,.actions,.back,.map,.search,#toast{display:none!important}main{padding:0}.panel{border:0}}
</style>
</head>

<header><div class="head"><div class="brand">Toyota Omotenashi Manager<small>Toyota Way Challenge · 30 kérdés</small></div><a class="back" href="./">Vissza a naplóhoz</a></div></header>
<main id="view"><p class="intro">A játék betöltése…</p></main><div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script>
'use strict';
const QUESTIONS=[["Omotenashi","Egy étterembe mankóval érkezik egy vendég. Melyik reakció fejezi ki legjobban az Omotenashit?",["A pincér kérés nélkül átülteti az ajtó mellé.","Diszkréten megkérdezi, segítene-e egy kényelmesebb hely.","Ugyanúgy szolgálja ki, mint a többi vendéget.","Felajánl egy desszertet a kellemetlenségért."],1,"Az Omotenashi figyelmes, előrelátó gondoskodás. A pincér észreveszi a helyzetet, de a vendéggel egyezteti, milyen segítség lenne valóban hasznos."],["Ichigo Ichie","Egy ügyfél ötödször vásárol nálatok. Mit jelent ilyenkor az Ichigo Ichie?",["Minden visszatéréskor új kedvezményt kell ajánlani.","Az ismert igény alapján gyorsan lezárható az ügy.","A mai találkozás körülményeire is külön figyelünk.","Ugyanazt a kiszolgálást kapja, mint korábban."],2,"Az Ichigo Ichie szerint minden találkozás egyszeri alkalom. Egy visszatérő ügyfél igénye, élethelyzete vagy döntési szempontja is változhatott."],["Customer First","Az ügyfél kisautót keres, de készleten inkább nagyobb modellek vannak. Mi a Customer First szerinti lépés?",["Tisztázod az igényét, és ahhoz keresel jó megoldást.","A készleten lévő autók előnyeit helyezed előtérbe.","Az elérhető legnagyobb kedvezményt ajánlod.","Először a gyors szállíthatóságot hangsúlyozod."],0,"A Customer First az ügyfél szempontjainak elsődleges figyelembevételét jelenti. A készlet lehetőség, de nem írhatja felül az ügyfél valódi igényének megértését."],["Muda","Naponta sok perc megy el az autókulcsok keresésével. Melyik fogalom nevezi meg ezt a veszteséget?",["Gemba","Yokoten","Andon","Muda"],3,"A Muda pazarlás: minden olyan felesleges tevékenység, amely erőforrást használ, miközben nem teremt értéket. A kulcskeresés ilyen veszteség."],["Gemba","Egy szállodában lassú a bejelentkezés. Hol van ennek a folyamatnak a Gembája?",["A vendégértékelések adatbázisában.","A recepción, a tényleges ügyintézés helyén.","A vezetői havi értekezleten.","Az új ügyfélfogadási szabályzatban."],1,"A Gemba az a valós hely, ahol a munka és az értékteremtés történik. A recepciós folyamatot ott lehet közvetlenül megfigyelni."],["Genchi Genbutsu","Két részleg egymást okolja a késő átadásokért. Mit tesz először a Genchi Genbutsut követő vezető?",["Elkéri mindkét részleg írásos beszámolóját.","Előbb összeveti az elmúlt havi mutatókat.","Végigkövet egy valós átadást, és tényeket gyűjt.","Azonnal új határidőt ír elő."],2,"A Genchi Genbutsu azt jelenti: menj oda, nézd meg magad, és értsd meg a tényeket. A beszámolók hasznosak lehetnek, de a közvetlen megfigyelés nélkülözhetetlen."],["Kaizen","Reggel hosszú sor alakul ki egy kávézóban. Melyik lépés mutatja legjobban a Kaizen szemléletét?",["Új munkasorrendet próbálnak ki, majd mérik a hatást.","Új gépet vesznek, mert gyorsabbnak ígérik.","Több dolgozót osztanak be minden reggel.","Kötelező gyorsasági célt vezetnek be."],0,"A Kaizen folyamatos, tényekre épülő fejlesztés. A kipróbálható változtatás és a hatás ellenőrzése teszi tanulási folyamattá."],["Andon","Hiányzik egy autó átadás előtti ellenőrzésének igazolása. Mi az Andon-szemléletű lépés?",["Későbbre halasztják a dokumentálást.","A kolléga önállóan mérlegeli a kockázatot.","A következő értekezletre viszik az ügyet.","Jeleznek, segítséget kérnek, és tisztázzák az eltérést."],3,"Az Andon az eltérés látható jelzése és a segítségkérés. A tisztázásig az érintett folyamatlépést szükség szerint vissza kell tartani."],["Respect for People","Egy új kolléga bizonytalan az autóátadáskor. Melyik vezetői reakció illik a Respect for People elvéhez?",["A vezető átveszi tőle a feladatot.","Közösen megértik az elakadást, majd a kolléga gyakorol.","A kolléga újra elolvassa a szabályzatot.","A hibát a következő értékelésen beszélik meg."],1,"Az emberek tisztelete magában foglalja a fejlődésük támogatását. A vezető segít megérteni a helyzetet, lehetőséget ad a gyakorlásra, és visszajelez."],["Toyota Way","Mi a Toyota Way 2001 két pillére?",["Kaizen és Just-in-Time","Jidoka és a sztenderdizálás","Continuous Improvement és Respect for People","Customer First és a költséghatékonyság"],2,"A Toyota Way 2001 két pillére a Continuous Improvement (folyamatos fejlesztés) és a Respect for People (az emberek tisztelete). A gyártási rendszer pillérei más fogalmak."],["Sztenderdizálás","Egy új kollégának az ügyfélfogadást tanítjátok. Melyik a használható sztenderd?",["Az ügyfél igényét tisztázó közös lépések, rugalmas megoldással.","A legsikeresebb kolléga teljes szövegének megtanulása.","Minden ügyfél számára azonos ajánlati sorrend.","A jó eredmény, előírt munkafolyamat nélkül."],0,"A sztenderd az ismert legjobb, tanítható munkamódszert rögzíti. A közös alaplépések mellett helye van az adott ügyfélhez illő megoldásnak."],["5 Miért","Rendszeresen késnek a szervizátadások. Melyik kérdés indítja jól az 5 Miért vizsgálatát?",["Ki felelős a legtöbb késésért?","Melyik ügyfélnek adjunk kártérítést?","Hogyan kérjünk mindenkitől nagyobb sebességet?","Mi történik az átadási folyamatban a késés előtt?"],3,"Az 5 Miért az okok feltárását támogatja. A folyamatban történtekből indulunk ki, majd a kapott válaszokra építjük a következő miért-kérdéseket."],["PDCA","Húsz ügyfélnél kipróbáltatok egy új időpont-egyeztetést. Mi következik a PDCA Check szakaszában?",["Kiadjátok a végleges új szabályzatot.","Összevetitek a próba eredményét a céllal.","Újabb ötleteket gyűjtötök a következő évre.","Automatikusan kiterjesztitek a teljes hálózatra."],1,"A Check az ellenőrzés szakasza: a tapasztalatot és az adatokat összevetjük a kitűzött céllal. Ez alapján dönthetünk a következő lépésről."],["Yokoten","Egy kereskedés bevált megoldást talál a várakozás csökkentésére. Mi a Yokoten?",["A fejlesztő kolléga elismerése.","A költségmegtakarítás kiszámítása.","A megoldás és a tanulság megosztása más kereskedésekkel.","A módszer kötelezővé tétele mindenhol."],2,"A Yokoten a bevált tudás vízszintes terjesztése. A másik területnek az alapelvet és a bevezetés feltételeit is meg kell értenie."],["Factory Kaizen","A gyártósoron sok idő megy el szerszámkereséssel. Új tárolást próbálnak ki, és mérik a hatást. Mi ez?",["Omotenashi","Office Kaizen","Yokoten","Factory Kaizen"],3,"A Factory Kaizen a gyártási működés fejlesztése. Itt a keresési veszteséget csökkentik, és ellenőrzik, bevált-e a változtatás."],["Office Kaizen","Egy irodában három jóváhagyás feleslegesnek bizonyul. Az ellenőrzés megmarad, a folyamat rövidül. Mi ez?",["Office Kaizen","Factory Kaizen","Andon","Genchi Genbutsu"],0,"Az Office Kaizen az irodai és adminisztratív folyamatok fejlesztése. A felesleges lépések csökkentése csak a szükséges kontrollok megőrzésével jó megoldás."],["Ichigo Ichie","A fodrászod tíz éve ismer, mégis megkérdezi, mit szeretnél ma. Miért jó ez az Ichigo Ichie szerint?",["Mert így hamarabb végezhet.","Mert a mai igényed eltérhet a korábbitól.","Mert minden alkalommal új szolgáltatást kell ajánlani.","Mert azonos kérdésekkel elkerülhető a panasz."],1,"Az Ichigo Ichie a jelen találkozás egyszeriségére irányítja a figyelmet. A korábbi tapasztalat értékes, de nem helyettesíti a mai helyzet megértését."],["Muda","Az ügyfélnek négyszer kell megadnia ugyanazt a cégadatot. Melyik javítás csökkentheti a Mudát?",["Minden ügyintéző külön, gyorsabban kérdezi be.","Az ügyfél előre négy példányban kitölti.","Megvizsgálják, hogyan adható tovább biztonságosan a már rögzített adat.","A felesleges adatok helyett új adatokat kérnek."],2,"A Muda csökkentése itt az ismételt adatbekérés megszüntetését jelenti. Az adatok megosztása során a hozzáférés és az adatvédelem szabályait is meg kell tartani."],["Gemba / Genchi Genbutsu","Mi a különbség a Gemba és a Genchi Genbutsu között?",["A Gemba egy helyszín; a Genchi Genbutsu a helyszíni megismerés elve.","A Gemba a gyárra, a Genchi Genbutsu a szalonra vonatkozik.","A Gemba egy szabály, a Genchi Genbutsu egy mérőszám.","A két szó teljesen azonos jelentésű."],0,"A Gemba a munkavégzés tényleges helye. A Genchi Genbutsu azt az elvet írja le, hogy személyesen, a tényekből ismerjük meg a helyzetet."],["Andon","Egy kolléga fél szólni a hibáról. Hogyan reagáljon a vezető, hogy az Andon legközelebb is működjön?",["Kérje, hogy csak teljes bizonyossággal jelezzen.","Várja meg az eset utáni heti értékelést.","A jelzést bízza a hibáért felelős részlegre.","Köszönje meg a jelzést, segítsen, majd tisztázzák az okot."],3,"A jelzés akkor válik mindennapi gyakorlattá, ha a munkatárs érdemi, támogató választ kap. A gyors segítség és a tények tisztázása vezetői felelősség."],["5 Miért","A mosó késve kapja az autót, mert sokáig keresték a kulcsot. Mi legyen a következő 5 Miért-kérdés?",["Ki hagyta el legutóbb a kulcsot?","Miért tartott ilyen sokáig megtalálni a kulcsot?","Melyik ügyfél panaszkodott a leghangosabban?","Mennyi pótidőt írjunk elő a munkatervbe?"],1,"Az 5 Miért minden lépése egy ténnyel alátámasztható ok felé visz. Még nem tudjuk, hogy a tárolási rend, az átadás vagy valami más okozta a keresést."],["PDCA","Egy új munkamódszer bizonyítottan jobb lett a próba során. Mit tegyetek a PDCA Act lépésében?",["Visszatértek a korábbi módszerhez.","Új célt választotok az eredmény elemzése nélkül.","Rögzítitek a bevált megoldást, és döntötök a kiterjesztésről.","Lezárjátok a fejlesztést további ellenőrzés nélkül."],2,"Az Act a tanulságból következő beavatkozás. A bevált módszert sztenderddé lehet alakítani; a következő körben tovább figyelhető és fejleszthető."],["Sztenderdizálás","Hogyan lehet sztenderdizálni a kiszolgálást, ha az ügyfelek igényei különböznek?",["Minden ügyfél ugyanazt a szolgáltatási csomagot kapja.","Csak az új dolgozókra vonatkozik a sztenderd.","A tapasztalt munkatársakra nem kell közös eljárás.","Rögzítjük a közös lépéseket, a megoldást az ügyfélhez igazítjuk."],3,"Sztenderd lehet például az igény tisztázása, az információ ellenőrzése és a következő lépés egyeztetése. Ettől a segítség továbbra is személyes maradhat."],["Yokoten","Másik kereskedés bevált megoldását vennétek át. Mi az érett Yokoten-megközelítés?",["Megértitek és megosztjátok a tanulságot, majd helyben kipróbáljátok.","Pontosan lemásoljátok, mert máshol működött.","Először kötelező szabályzatot írtok belőle.","Csak az ötletgazdától kértek egy rövid leírást."],0,"A jó gyakorlat terjesztése során a miértek és a működési feltételek is számítanak. A helyi próba mutatja meg, mi működik az új környezetben."],["Factory / Office Kaizen","A gyárban színjelzés mutatja az elakadást. Hogyan alkalmaznád ezt az elvet egy kereskedés irodájában?",["Színes névtáblát rendelnétek az adminisztrátoroknak.","Láthatóvá tennétek a függő ügyeket, felelősöket és következő lépéseket.","Színes havi kimutatást készítenétek a munkatársakról.","Pontosan lemásolnátok a gyári jelzőberendezést."],1,"A Factory Kaizen megoldásának elve átültethető Office Kaizenbe. Az irodai vizuális jelzés akkor hasznos, ha az aktuális eltérést és a szükséges lépést mutatja."],["Respect for People / Customer First","A kollégák szerint nehézkes az ügyfélfogadás, de senki nem kérdezte őket. Melyik vezetői lépés a legjobb?",["A havi ügyfélelégedettség alapján új célt írsz elő.","A legsikeresebb kollégára bízod a folyamatot.","Bevonod őket a helyzet feltárásába és a megoldás kipróbálásába.","Egységes kötelező mondatokat adsz mindenkinek."],2,"A Respect for People a munkatársak tapasztalatát és fejlődését is komolyan veszi. A Customer First az ügyfélre gyakorolt hatást is vizsgálja."],["Kaizen","Egy vezető szerint a Kaizen azt jelenti, hogy minden héten kötelező valamit megváltoztatni. Mi ezzel a gond?",["A változtatás tényleges hatását is ellenőrizni kell.","A Kaizen kizárólag éves fejlesztési esemény.","Kaizent csak a gyártásban lehet alkalmazni.","Csak a felső vezetés indíthat Kaizent."],0,"A Kaizen célja a jobb, tartósabban működő folyamat. A változtatás önmagában nem eredmény; a hatásból tanulni kell."],["Toyota Way · kutatós","Keressetek rá a Toyota Way 2001-re! Melyik az öt hivatalos alapérték?",["Challenge, Kaizen, Jidoka, Just-in-Time, Respect","Customer First, Omotenashi, Kaizen, Andon, Yokoten","Respect, Standard, PDCA, Kaizen, Gemba","Challenge, Kaizen, Genchi Genbutsu, Respect, Teamwork"],3,"A Toyota Way 2001 öt értéke: Challenge, Kaizen, Genchi Genbutsu, Respect és Teamwork. A két fő pillér a Continuous Improvement és a Respect for People.","Toyota Way 2001 five values official Toyota","https://www.toyota-global.com/company/history_of_toyota/75years/data/conditions/philosophy/toyotaway2001.html"],["Andon · kutatós","Keressetek rá az Andon és a Jidoka kapcsolatára! Melyik értelmezés helyes?",["Andon: gyártási ütemezés; Jidoka: készletszabály.","Andon: eltérésjelzés; Jidoka: a hibás továbbtermelés megelőzése.","Andon: utólagos audit; Jidoka: havi minőségjelentés.","Andon: megállítási elv; Jidoka: a jelzőtábla."],1,"Az Andon jelzéssel teszi láthatóvá az eltérést és segítséget kér. A Jidoka a rendellenesség felismerését és a hibás továbbtermelés megakadályozását támogatja.","Toyota Andon Jidoka relationship official Toyota","https://mag.toyota.co.uk/andon-toyota-production-system/"],["A teljes folyamat","Késnek az autóátadások. Melyik fejlesztési út illik legjobban a tanult Toyota-szemlélethez?",["Felelős keresése → szabályzat → gyorsabb munka.","Új szoftver → oktatás → havi jelentés.","Megfigyelés → okfeltárás → próba → mérés → sztenderd → megosztás.","Vezetői döntés → azonnali bevezetés → utólagos értékelés."],2,"A helyszíni megismerésből és az okfeltárásból indulunk. A Kaizen-próbát PDCA-val ellenőrizzük, a bevált módszert sztenderdizáljuk, majd Yokotennel továbbadjuk."]];
const KEY='toyota-omotenashi-quiz-v1', VERSION=1;
const ABC='ABCD';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:VERSION,started:false,finished:false,current:0,mode:'pair',team:'',answers:Array(QUESTIONS.length).fill(null),finishedAt:''});
function valid(s){return !!(s&&s.version===VERSION&&typeof s.started==='boolean'&&typeof s.finished==='boolean'&&(!s.finished||s.started)&&Number.isInteger(s.current)&&s.current>=0&&s.current<QUESTIONS.length&&['solo','pair','group'].includes(s.mode)&&typeof s.team==='string'&&s.team.length<=120&&Array.isArray(s.answers)&&s.answers.length===QUESTIONS.length&&s.answers.every(a=>a===null||(Number.isInteger(a)&&a>=0&&a<4))&&typeof s.finishedAt==='string'&&s.finishedAt.length<60);}
let game=fresh(),storageOK=true,primaryLoaded=false,editRevision=0,mirrorOK=false;
try{const raw=localStorage.getItem(KEY);if(raw){const loaded=JSON.parse(raw);if(valid(loaded)){game=loaded;primaryLoaded=true;}}}catch{storageOK=false;}
function save(){
 editRevision++;game.savedAt=new Date().toISOString();
 const snapshot=JSON.stringify(game),revision=editRevision;
 try{localStorage.setItem(KEY,snapshot);storageOK=true;primaryLoaded=true;}catch{storageOK=false;}
 mirrorOK=false;
 if(window.OmotSafety)OmotSafety.mirror('quiz',snapshot).then(()=>{
  if(editRevision===revision){mirrorOK=true;if(!storageOK)render();}
 }).catch(()=>{if(editRevision===revision){mirrorOK=false;if(!storageOK)render();}});
}
async function recoverQuizCopy(){
 if(!window.OmotSafety)return;
 const initialRevision=editRevision;
 try{
  const snapshot=await OmotSafety.read('quiz');
  if(!snapshot||initialRevision!==editRevision)return;
  const candidate=JSON.parse(snapshot);
  if(!valid(candidate))return;
  if(!primaryLoaded||(Date.parse(candidate.savedAt)||0)>(Date.parse(game.savedAt)||0)){
   game=candidate;save();render();
  }
 }catch{/* primary local copy and downloaded backups remain usable */}
}
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.add('hidden'),3500);}
function count(){return game.answers.filter(a=>a!==null).length;}
function scrollUp(){window.scrollTo({top:0,behavior:'instant'});}
function tagLine(){return '<div class="eyebrow">Toyota on the Road / önálló tanulás</div>';}
function storageNote(){return storageOK?'':'<div class="warning">Az elsődleges mentés sikertelen. '+(mirrorOK?'Másodlagos helyi másolat készült.':'A másodlagos mentés sincs megerősítve.')+' Ne zárd be az oldalt, amíg nem sikerült az adatmentés.</div>';}
function renderIntro(){
 $('view').innerHTML=tagLine()+'<h1>Toyota Way Challenge</h1><p class="intro">Harminc kérdés, tizenhat kulcsfogalom. Beszéljétek meg a válaszokat, keressetek rá bármire, és haladjatok a saját tempótokban.</p><section class="panel"><h2>Indulhat a kihívás?</h2><p class="muted">1 pont minden helyes válaszért. Nincs időbónusz. A megoldásokat és a magyarázatokat csak a végleges lezárás után látjátok.</p><label class="field">Hogyan játszotok?<select id="mode"><option value="solo"'+(game.mode==='solo'?' selected':'')+'>Egyénileg</option><option value="pair"'+(game.mode==='pair'?' selected':'')+'>Párban</option><option value="group"'+(game.mode==='group'?' selected':'')+'>Kiscsoportban</option></select></label><label class="field">Játékos vagy csapat neve (nem kötelező)<input id="team" type="text" maxlength="120" autocomplete="off" placeholder="Például: Kolín expressz" value="'+esc(game.team)+'"></label><div class="actions"><button class="primary" id="start">Kvíz indítása</button></div></section><div class="notice">Ha közben megszakítjátok, ugyanebben a böngészőben folytathatjátok. Az eredmény csak ezen az eszközön tárolódik; nincs központi ranglista.</div>'+storageNote()+'<footer>A kvíz a Toyota Omotenashi Manager tanulási naplójának része. A jegyzeteid ettől függetlenül megmaradnak.</footer>';
 $('mode').onchange=e=>{game.mode=e.target.value;save();};
 $('team').oninput=e=>{game.team=e.target.value;save();};
 $('start').onclick=()=>{game.started=true;save();render();scrollUp();};
}
function navButtons(){return '<div class="actions"><button class="secondary" id="prev-q" '+(game.current===0?'disabled':'')+'>Előző kérdés</button><button class="primary" id="next-q">'+(game.current===QUESTIONS.length-1?'Lezárás és értékelés':'Következő kérdés')+'</button></div>';}
function renderQuestion(){
 const i=game.current,q=QUESTIONS[i],answered=count();
 $('view').innerHTML=tagLine()+'<h1>Toyota Way Challenge</h1><div class="pills"><span class="pill">'+(i+1)+' / '+QUESTIONS.length+'. kérdés</span><span class="pill">'+answered+' megválaszolva</span><span class="pill">'+esc(q[0])+'</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="30" aria-valuenow="'+answered+'" aria-label="Megválaszolt kérdések"><div style="width:'+(answered/QUESTIONS.length*100)+'%"></div></div><section class="panel"><h2>'+esc(q[1])+'</h2>'+(q[5]?'<p class="muted">Kutatós kérdés: itt szabad és érdemes utánanézni.</p><a class="search" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q='+encodeURIComponent(q[5])+'">Keressetek rá a Google-ben ↗</a>':'')+q[2].map((o,n)=>'<button class="option'+(game.answers[i]===n?' selected':'')+'" data-choice="'+n+'" aria-pressed="'+(game.answers[i]===n)+'"><span class="letter">'+ABC[n]+'.</span><span>'+esc(o)+'</span></button>').join('')+'<p class="muted">A választ a lezárásig bármikor módosíthatjátok. A helyes megoldást addig nem mutatjuk.</p></section>'+navButtons()+'<section class="panel"><h3>Ugrás másik kérdéshez</h3><div class="map" aria-label="Kérdésválasztó">'+QUESTIONS.map((x,n)=>'<button data-jump="'+n+'" class="'+(game.answers[n]!==null?'done ':'')+(i===n?'current':'')+'" aria-label="'+(n+1)+'. kérdés'+(game.answers[n]!==null?', megválaszolva':'')+'">'+(n+1)+'</button>').join('')+'</div><p class="small">A halványzöld mezők már megválaszolt kérdéseket jelölnek. A pontszám csak a lezárás után látható.</p></section>'+storageNote()+'<footer>Játékidő nincs. A páros megbeszélés és a Google-keresés a feladat része.</footer>';
 document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{game.answers[game.current]=Number(el.dataset.choice);save();renderQuestion();});
 document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>{game.current=Number(el.dataset.jump);save();render();scrollUp();});
 $('prev-q').onclick=()=>{if(game.current>0){game.current--;save();render();scrollUp();}};
 $('next-q').onclick=()=>{if(game.current<QUESTIONS.length-1){game.current++;save();render();scrollUp();}else finish();};
}
function finish(){
 const missing=game.answers.findIndex(a=>a===null);
 if(missing>=0){notify('Még '+(QUESTIONS.length-count())+' kérdésre nem válaszoltatok.');game.current=missing;save();render();scrollUp();return;}
 if(!confirm('Lezárjátok a kvízt? Utána a válaszok már nem módosíthatók, de minden magyarázat megjelenik.'))return;
 game.finished=true;game.finishedAt=new Date().toISOString();save();render();scrollUp();
}
function correctCount(){return game.answers.reduce((a,x,i)=>a+(x===QUESTIONS[i][3]?1:0),0);}
function resultsText(){const c=correctCount();return 'Toyota Way Challenge\n'+(game.team?'Játékos / csapat: '+game.team+'\n':'')+(game.mode==='solo'?'Egyéni':game.mode==='pair'?'Páros':'Kiscsoportos')+' játék\nEredmény: '+c+'/30 pont\n'+(c===30?'Hibátlan eredmény.\n':'')+'Lezárva: '+new Date(game.finishedAt).toLocaleString('hu-HU');}
function renderResult(){
 const c=correctCount();
 $('view').innerHTML=tagLine()+'<h1>A kvíz eredménye</h1><section class="panel"><p class="eyebrow">'+esc(game.team||'Toyota Way Challenge')+'</p><div class="score">'+c+' / 30</div><p class="muted">'+c+' helyes válasz a 30-ból · '+Math.round(c/30*100)+'%</p><div class="progress"><div style="width:'+(c/30*100)+'%"></div></div><p class="intro">'+(c===30?'Hibátlan eredmény.':'A tévesztett válaszok magyarázatait érdemes átnézni.')+'</p><div class="actions"><button class="secondary" id="copy-score">Eredmény másolása</button><button class="primary" id="show-review">Megoldások és magyarázatok</button></div></section><section class="panel" id="review"><h2>Kérdésenkénti visszajelzés</h2><p class="intro">A saját választ, a helyes megoldást és a szakmai magyarázatot is látjátok. Így a tévesztésekből is lehet tanulni.</p>'+QUESTIONS.map((q,i)=>{const right=game.answers[i]===q[3];return '<article class="review"><p class="eyebrow">'+(i+1)+'. kérdés · '+esc(q[0])+'</p><h3>'+esc(q[1])+'</h3><p class="'+(right?'correct':'wrong')+'">'+(right?'Helyes válasz · +1 pont':'Ezt most másképp érdemes értelmezni · 0 pont')+'</p><div class="answerline"><b>A választott lehetőség:</b> '+ABC[game.answers[i]]+'. '+esc(q[2][game.answers[i]])+'</div>'+(!right?'<div class="answerline"><b>Helyes megoldás:</b> '+ABC[q[3]]+'. '+esc(q[2][q[3]])+'</div>':'')+'<p class="explanation">'+esc(q[4])+'</p>'+(q[6]?'<a class="search" target="_blank" rel="noopener noreferrer" href="'+esc(q[6])+'">Toyota-forrás megnyitása ↗</a>':'')+'</article>';}).join('')+'</section><div class="actions"><a href="./" class="secondary" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Vissza a tanulási naplóhoz</a><button id="restart" class="light">Új játék indítása</button></div>'+storageNote()+'<footer>A játék lezárt eredménye ebben a böngészőben marad. Az új játék törli a korábbi kvízeredményt, de a tanulási naplót nem érinti.</footer>';
 $('show-review').onclick=()=>$('review').scrollIntoView({behavior:'smooth'});
 $('copy-score').onclick=async()=>{try{await navigator.clipboard.writeText(resultsText());notify('Az eredményt a vágólapra másoltuk.');}catch{notify('Ezen a böngészőn a másolás nem sikerült.');}};
 $('restart').onclick=()=>{if(!confirm('Új játékot kezdesz? A korábbi pontszám és az összes kvízválasz törlődik. A naplód érintetlen marad.'))return;const mode=game.mode,team=game.team;game=fresh();game.mode=mode;game.team=team;save();render();scrollUp();};
}
function render(){if(game.finished)renderResult();else if(game.started)renderQuestion();else renderIntro();}
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const incoming=JSON.parse(e.newValue);if(valid(incoming)){editRevision++;game=incoming;render();}}catch{}}});
render();
recoverQuizCopy();
</script>
</body>
</html>
