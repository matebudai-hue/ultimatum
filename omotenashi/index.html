<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eb0a1e"><meta name="description" content="Saját jegyzeteim a Toyota Omotenashi Manager kétnapos záróprogramján.">
<title>Omotenashi Manager – Saját jegyzeteim</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f4f5f6;--red:#d9091c;--line:#dce0e4;--muted:#61666d}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #1864ab;outline-offset:3px}header{border-top:5px solid var(--red);background:#fff;border-bottom:1px solid var(--line)}.head{max-width:780px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:19px;font-weight:800;color:var(--red)}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}.small-button{background:#fff;color:#202124;border:1px solid #bcc2c9;border-radius:7px;padding:8px 11px;min-height:42px;font-size:13px}main{max-width:780px;margin:auto;padding:20px 18px 132px}h1{font-size:30px;letter-spacing:-.6px;line-height:1.15;margin:22px 0 12px}h2{font-size:21px;line-height:1.3;margin:0 0 14px}h3{font-size:18px;line-height:1.35;margin:0 0 12px}p{line-height:1.5}.intro{font-size:16px;color:#4e555d;margin-bottom:21px}.eyebrow{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:bold;letter-spacing:1px}.section-label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}#stage{width:100%;font-size:15px;padding:11px;border:1px solid #b8bec5;border-radius:8px;background:#fff;min-height:46px;color:#202124}.panel,.point{border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px;margin:14px 0}.point{padding:0;scroll-margin-top:15px}.point[open]{border-color:#a7adb5}.point summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:bold;font-size:16px}.point summary::-webkit-details-marker{display:none}.point summary::before{content:'+';color:var(--red);font-size:21px;font-weight:400;min-width:17px}.point[open] summary::before{content:'−'}.point summary .caption{flex:1;min-width:0;overflow-wrap:anywhere}.point summary small{font-weight:normal;font-size:11px;color:var(--muted);white-space:nowrap}.point .inside{padding:0 14px 16px}.point .inside>p{overflow-wrap:anywhere;margin:0 0 12px;color:#555;line-height:1.45;font-size:15px}label.field{display:block;margin:16px 0;font-size:15px;font-weight:bold;line-height:1.4}label.field:first-child{margin-top:0}input[type=text],input[type=date],textarea,select.field-select{display:block;width:100%;border:1px solid #b2b9c1;border-radius:7px;padding:11px;margin-top:7px;background:#fff;color:#202124;font-size:16px;line-height:1.4}textarea{min-height:108px;resize:vertical}textarea.big{min-height:150px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--red);flex-shrink:0}.check{display:flex;align-items:center;gap:9px;min-height:39px;font-size:15px;line-height:1.3;margin:5px 0}.muted{font-size:13px;color:var(--muted);line-height:1.5}.note{background:#fff;border-left:3px solid var(--red);padding:11px 13px;font-size:14px;line-height:1.5;margin:16px 0}.question{font-size:17px;line-height:1.5;font-weight:bold}.red{color:var(--red)}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1;min-width:120px}.primary,.secondary,.danger{border:0;border-radius:8px;padding:13px 16px;min-height:47px;font-weight:bold;line-height:1.25}.primary{background:var(--red);color:#fff}.secondary{background:#e9ecef;color:#202124}.danger{background:#fff;color:#a10c19;border:1px solid #d5a8ae;font-size:14px}.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.button-row button{font-size:13px;min-height:42px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));z-index:5}.bottom-inner{max-width:744px;margin:auto}.save-line{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;min-height:18px;line-height:1.4;margin-top:7px}.error{color:#a10918;font-weight:bold}.feedback{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.report-block{border-bottom:1px solid var(--line);padding:5px 0 15px;margin-bottom:17px}.report-block dt{font-weight:bold;margin:13px 0 4px;line-height:1.4}.report-block dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#42474e;line-height:1.5}.tag{font-size:11px;color:var(--muted)}.hidden{display:none!important}.inline-help{font-size:12px;color:var(--muted);line-height:1.4;font-weight:normal;margin-top:5px}.banner{max-width:780px;margin:auto;padding:12px 18px;background:#fff3d6;line-height:1.45;font-size:14px}.banner button{margin-top:8px}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#202124;color:#fff;padding:12px 18px;border-radius:8px;width:max-content;max-width:calc(100% - 30px);z-index:20;box-shadow:0 3px 18px #0003;line-height:1.4}.privacy{font-size:12px;color:var(--muted);line-height:1.5;margin:23px 0}.edit-form{border-top:1px solid var(--line);margin-top:12px;padding-top:15px}summary.simple{cursor:pointer;min-height:42px;padding:10px 0;font-weight:bold;font-size:14px}button:disabled{opacity:.45;cursor:default}#print-area{display:none}.print-report{white-space:pre-wrap;font-family:Arial,Helvetica,sans-serif;line-height:1.5;overflow-wrap:anywhere}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.count{margin:12px 0;color:var(--muted);font-size:13px}@media(max-width:420px){main{padding:16px 13px 138px}.head{padding:13px}.panel{padding:14px}.brand{font-size:17px}h1{font-size:28px}.two{grid-template-columns:1fr}.bottom{padding-left:13px;padding-right:13px}.point summary{padding:12px}.actions>*{min-width:110px}}@media print{body{background:#fff}header,main,.bottom,.banner,.toast{display:none!important}#print-area{display:block;font-size:10.5pt}.print-report{white-space:pre-wrap}#print-area h1{font-size:20pt} @page{size:A4;margin:17mm}}
</style>
</head>
<body>
<header><div class="head"><div class="brand">Toyota Omotenashi Manager<small>Kétnapos tanulási napló</small></div><button class="small-button" id="summary-button">Jegyzeteim</button></div></header>
<div id="update-banner" class="banner hidden" role="status"></div>
<div id="storage-warning" class="banner hidden" role="alert"></div>
<main><label class="section-label" for="stage">Progrész kiválasztása</label><select id="stage"></select><div id="app"></div></main>
<div class="bottom"><div class="bottom-inner"><div class="actions"><button id="prev" class="secondary">Előző</button><button id="next" class="primary">Következő</button></div><div class="save-line"><span id="save-status" role="status" aria-live="polite"></span><span id="offline-status"></span></div></div></div>
<div id="toast" class="toast hidden" role="status"></div><div id="print-area"></div>
<script>
'use strict';
const APP_VERSION='2026.10.16.3';
// The storage key never includes a release number: updates must preserve participant notes.
const KEY='toyota-omotenashi-notebook-v1',BACKUP=KEY+'-backup';
const STAGES=['Toyota on the Road','Páros beszélgetések','Gyári megfigyelések','Mit láttunk?','Kaizen a kereskedésben','Személyes vezetői terv','Páros transzfer','Jegyzeteim és mentés'];
const FOCUS=['Ügyfélre figyelés','Munkatársak tanítása','Kaizen a napi működésben','Sztenderdek kialakítása','Problémák jelzése és kezelése','Saját vezetői működésem'];
const PAIR_QUESTIONS=[
 'Mi az, amit a kereskedésedben a legnehezebb következetesen jól csinálni? Hozz egy konkrét esetet.',
 'Mi ebben a te vezetői szereped? Mit próbáltál már, és mi történt?',
 'Milyen kérdésre keresnél választ a gyárlátogatáson, ami segítene ebben a helyzetben?'
];
const TEMPLATES=[
 ['work','Mi könnyíti meg a munkát?','Milyen megoldás csökkenti a keresést, várakozást, felesleges mozdulatot vagy újramunkát?','Muda, Gemba'],
 ['visual','Mit mond el a munkakörnyezet?','Honnan látszik, mi hol van, hol tart a munka, és mi a következő lépés?','Vizuális menedzsment'],
 ['standard','Honnan tudható, mi a jó munkamódszer?','Mi teszi egyértelművé a feladat sorrendjét, az elvárt minőséget és azt, hogy egy lépés kész?','Sztenderdizálás'],
 ['handover','Hogyan adják tovább a munkát?','Hogyan jut el az alkatrész, eszköz vagy információ a következő munkapontra? Mi előzi meg a hiányt vagy félreértést?','Folyamatok és átadások'],
 ['signal','Hogyan jeleznek eltérést és kérnek segítséget?','Hogyan válik láthatóvá egy probléma? Kitől és hogyan lehet segítséget kérni, és milyen választ kap a jelzés?','Andon, vezetői reakció'],
 ['learning','Hogyan tanulnak egy hibából?','Mit mutatnak vagy mondanak arról, hogyan keresik az okot, és hogyan előzik meg ugyanannak a hibának az ismétlődését?','5 Miért, folyamatvédelem'],
 ['people','Hogyan vonják be a munkatársakat?','Milyen konkrét példát látsz vagy hallasz arra, hogy egy kolléga tapasztalatából, javaslatából született változtatás?','Respect for People, Kaizen'],
 ['improve','Honnan tudják, hogy egy javítás bevált?','Mutatnak-e egy kis fejlesztési próbát? Miből ellenőrizték az eredményét, és mi lett a következő lépés?','PDCA, Kaizen'],
 ['leader','Mit tesz a vezető a munka támogatásáért?','Milyen vezetői viselkedés segíti, hogy a munkatárs önállóan dolgozzon, kérdezzen vagy időben jelezzen?','Vezetői szerep, támogatás'],
 ['spread','Hogyan tanítják és adják tovább a jó megoldást?','Hogyan tanulják meg az új munkamódszert, és hogyan jut el a bevált tudás más kollégákhoz vagy területekhez?','Tanítás, Yokoten']
];
const PLAN_QUESTIONS=['Mi volt a legfontosabb felismerésem?','Hol tudom ezt alkalmazni?','Hogyan fogom csinálni?','Milyen nehézséggel találkozhatok?','Mire tudok támaszkodni?','Milyen apró lépésekben indulok?','Mi lesz az első konkrét lépésem, és mikor?'];
const COACH_QUESTIONS=['Honnan fogod tudni, hogy működik?','Mi lesz az első jele annak, hogy elakadtál?','Mit teszel, ha ez megtörténik?','Mi az a legkisebb lépés, amit biztosan meg tudsz tenni?'];
const SOURCES=['Még nincs rögzítve','Láttam','A kísérőtől hallottam','Nem volt megfigyelhető'];
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
function point(t){return {id:uid(),template:t?.[0]||'',title:t?.[1]||'Saját megfigyelési szempont',question:t?.[2]||'',topic:t?.[3]||'Saját szempont',focus:false,source:0,evidence:'',connection:''};}
function fresh(){return {schema:1,stage:0,createdAt:new Date().toISOString(),updatedAt:'',name:'',road:{expectation:'',focus:[],other:''},pairs:PAIR_QUESTIONS.map((q,i)=>({id:uid(),question:q,partner:'',note:''})),observations:TEMPLATES.map(point),deletedTemplates:[],reflection:{fact:'',meaning:'',expectation:''},kaizen:{idea:'',where:'',trial:'',signal:''},plan:Array(7).fill(''),coaching:{partner:'',answers:Array(4).fill('')}};}
const isText=v=>typeof v==='string'&&v.length<=50000;
function valid(s){
 if(!s||s.schema!==1||!Number.isInteger(s.stage)||s.stage<0||s.stage>7||!isText(s.name)||!isText(s.createdAt)||!isText(s.updatedAt))return false;
 if(!s.road||!isText(s.road.expectation)||!isText(s.road.other)||!Array.isArray(s.road.focus)||s.road.focus.length>30||!s.road.focus.every(isText))return false;
 if(!Array.isArray(s.pairs)||s.pairs.length>40||!s.pairs.every(x=>x&&['id','question','partner','note'].every(k=>isText(x[k]))))return false;
 if(!Array.isArray(s.observations)||s.observations.length>100||!s.observations.every(x=>x&&['id','template','title','question','topic','evidence','connection'].every(k=>isText(x[k]))&&typeof x.focus==='boolean'&&Number.isInteger(x.source)&&x.source>=0&&x.source<=3))return false;
 if(![...s.observations,...s.pairs].every(x=>/^[a-zA-Z0-9_-]{1,80}$/.test(x.id)))return false;
 if(new Set(s.observations.map(x=>x.id)).size!==s.observations.length||new Set(s.pairs.map(x=>x.id)).size!==s.pairs.length)return false;
 if(!Array.isArray(s.deletedTemplates)||!s.deletedTemplates.every(isText)||!s.reflection||!['fact','meaning','expectation'].every(k=>isText(s.reflection[k])))return false;
 if(!s.kaizen||!['idea','where','trial','signal'].every(k=>isText(s.kaizen[k]))||!Array.isArray(s.plan)||s.plan.length!==7||!s.plan.every(isText))return false;
 return !!s.coaching&&isText(s.coaching.partner)&&Array.isArray(s.coaching.answers)&&s.coaching.answers.length===4&&s.coaching.answers.every(isText);
}
let state=fresh(),storageOK=true,loadWarning='',tabConflict=false,focusedOnly=false,editing=new Set(),openPoints=new Set(),lastSaved='',waitingWorker=null;
try{const raw=localStorage.getItem(KEY);if(raw){const loaded=JSON.parse(raw);if(!valid(loaded))throw Error('Érvénytelen mentés');state=loaded;}}
catch(e){try{const old=JSON.parse(localStorage.getItem(BACKUP));if(valid(old)){state=old;loadWarning='Egy korábbi biztonsági mentést nyitottunk meg. Ellenőrizd a jegyzeteidet.';}else throw Error();}catch{storageOK=false;loadWarning='A korábbi mentést most nem tudtuk megnyitni. A meglévő adatot megőrizzük; a Jegyzeteim résznél letöltheted a helyi mentést.';}}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),4000);}
function status(){
 $('save-status').textContent=storageOK?(lastSaved?'Mentve '+lastSaved:'Automatikus mentés ezen az eszközön'):'A helyi mentés nem sikerült';
 $('save-status').classList.toggle('error',!storageOK);
 const w=$('storage-warning');w.textContent=tabConflict?'Egy másik böngészőlapon módosult a naplód. Ezen a lapon most nem mentünk. Töltsd le a saját másolatodat, vagy nyisd újra ezt a lapot a másik változat betöltéséhez.':loadWarning||(!storageOK?'A böngésző nem engedi a mentést. Töltsd le a jegyzeteid biztonsági másolatát a Jegyzeteim résznél.':'');w.classList.toggle('hidden',!w.textContent);
}
function save(){
 if(tabConflict){storageOK=false;status();return;}
 state.updatedAt=new Date().toISOString();
 try{const old=localStorage.getItem(KEY);if(old){try{if(valid(JSON.parse(old)))localStorage.setItem(BACKUP,old);else localStorage.setItem(KEY+'-unreadable',old);}catch{}}
 localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;lastSaved=new Date().toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});loadWarning='';}
 catch{storageOK=false;}status();
}
function setStage(index){state.stage=Math.max(0,Math.min(7,index));save();render();scrollTo(0,0);$('stage').focus({preventScroll:true});}
function area(path,label,value,placeholder='',big=false){const id='f-'+path.replace(/[^a-z0-9]/gi,'-');return `<label class="field" for="${id}">${esc(label)}<textarea id="${id}" data-field="${path}" ${big?'class="big"':''} placeholder="${esc(placeholder)}" maxlength="50000">${esc(value)}</textarea></label>`;}
function input(path,label,value){const id='f-'+path.replace(/[^a-z0-9]/gi,'-');return `<label class="field" for="${id}">${esc(label)}<input id="${id}" data-field="${path}" type="text" value="${esc(value)}" maxlength="1000"></label>`;}
function getAt(path){return path.split('.').reduce((o,k)=>o[k],state);}
function setAt(path,value){const ks=path.split('.');const last=ks.pop();let node=state;for(const k of ks)node=node[k];node[last]=value;}
function recalled(){const value=state.road.expectation.trim();return value?`<details class="panel"><summary class="simple">Induláskor ezt szerettem volna hazavinni</summary><div class="feedback">${esc(value)}</div></details>`:'';}
function myEvidence(){const obs=state.observations.filter(x=>x.evidence.trim());return obs.length?`<details class="panel"><summary class="simple">Saját gyári jegyzeteim (${obs.length})</summary>${obs.map(x=>`<h3>${esc(x.title)}</h3><p class="muted">${SOURCES[x.source]}</p><p class="feedback">${esc(x.evidence)}</p>`).join('')}</details>`:'';}
function render(){
 $('stage').innerHTML=STAGES.map((x,i)=>`<option value="${i}" ${state.stage===i?'selected':''}>${i+1}. ${x}</option>`).join('');
 $('prev').disabled=state.stage===0;$('next').textContent=state.stage===7?'Vissza az induláshoz':'Következő';
 const renderers=[road,pairs,observations,reflection,kaizen,plan,coaching,summary];$('app').innerHTML=renderers[state.stage]();bind();status();updateOffline();
}
function road(){return `<h1>Toyota on the Road</h1><p class="intro">A saját jegyzeteid végig veled maradnak a két nap során.</p><div class="panel">${area('road.expectation','Mit szeretnél hazavinni ebből a két napból?',state.road.expectation,'Egy saját helyzet, kérdés vagy dolog, amiben szeretnék előrelépni.',true)}</div><div class="panel"><h2>Mi legyen a saját tanulási fókuszom?</h2><p class="muted">Jelöld, ami most neked fontos. Többet is választhatsz.</p>${FOCUS.map((x,i)=>`<label class="check"><input type="checkbox" data-focus="${i}" ${state.road.focus.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}${area('road.other','Más, ami nekem fontos',state.road.other,'Ide saját fókuszt is írhatsz.')}</div><p class="privacy">A jegyzeteid ezen az eszközön, ebben a böngészőben maradnak. A „Jegyzeteim” gombnál másolatot is készíthetsz róluk.</p>`;}
function pairs(){return `<div class="eyebrow">Toyota on the Road</div><h1>Páros beszélgetések</h1><p class="intro">Minden párcsere után folytasd egy új jegyzetben. Kérdezzetek egymástól, és írjátok fel, ami a saját vezetői munkátokhoz hasznos.</p>${state.pairs.map((x,i)=>`<section class="panel"><h2>${i+1}. beszélgetés</h2><p class="question">${esc(x.question)}</p>${input('pairs.'+i+'.partner','Beszélgetőtársam (nem kötelező)',x.partner)}${area('pairs.'+i+'.note','Amit ebből magamnak felírok',x.note)}<button class="small-button" data-delete-pair="${i}">Beszélgetés törlése</button></section>`).join('')}<button class="secondary" id="add-pair">Új párcsere, új jegyzet</button><details class="panel"><summary class="simple">A három beszélgetési kérdés</summary>${PAIR_QUESTIONS.map(x=>`<p>${esc(x)}</p>`).join('')}</details>`;}
function observations(){
 const selected=state.observations.filter(x=>x.focus).length;
 const list=state.observations.map((x,i)=>({x,i})).filter(({x})=>!focusedOnly||x.focus);
 return `<div class="eyebrow">Felkészülés a buszon, jegyzetelés a gyárban</div><h1>Gyári megfigyeléseim</h1><p class="intro">Válassz 2–3 saját fókuszt. A kérdések arra irányítják a figyelmedet, mi segíti a kollégák jó munkáját, és mi vihető át ebből a kereskedésbe.</p><div class="note">Különítsd el, amit láttál és amit a kísérőtől hallottál. Amit nem lehetett megfigyelni, maradhat nyitott kérdés. Jegyzetelj a helyi látogatási szabályok szerint.</div><div class="actions"><button class="${focusedOnly?'secondary':'primary'}" id="all-points">Minden szempont</button><button class="${focusedOnly?'primary':'secondary'}" id="focused-points">Saját fókuszaim (${selected})</button></div><p class="count" id="point-count">${state.observations.length} szempont, ${state.observations.filter(x=>x.evidence.trim()).length} jegyzettel</p>${list.map(({x,i})=>`<details class="point" data-point-id="${x.id}" ${openPoints.has(x.id)?'open':''}><summary><span class="caption" data-point-title="${i}">${esc(x.title)}</span><small data-point-badge="${i}">${x.focus?'Fókusz ':''}${x.evidence.trim()?'Jegyzetelve':''}</small></summary><div class="inside"><p data-point-question="${i}">${esc(x.question)}</p><p class="tag">${esc(x.topic)}</p><label class="check"><input type="checkbox" data-point-focus="${i}" ${x.focus?'checked':''}>Ezt választom saját fókusznak</label><label class="field" for="source-${i}">Miből tudom?<select class="field-select" id="source-${i}" data-field="observations.${i}.source">${SOURCES.map((s,n)=>`<option value="${n}" ${x.source===n?'selected':''}>${s}</option>`).join('')}</select></label>${area('observations.'+i+'.evidence','Mit láttam vagy hallottam? Konkrét példa',x.evidence,'Egy helyzet, mondat, jelölés vagy munkamegoldás.')}${area('observations.'+i+'.connection','Mi lehet ebből hasznos nálunk?',x.connection,'Hol van hasonló helyzet a saját kereskedésemben?')}<div class="button-row"><button class="small-button" data-edit-point="${i}">${editing.has(x.id)?'Szerkesztés bezárása':'Szempont szerkesztése'}</button><button class="danger" data-delete-point="${i}">Szempont törlése</button></div>${editing.has(x.id)?`<div class="edit-form">${input('observations.'+i+'.title','Szempont neve',x.title)}${area('observations.'+i+'.question','Megfigyelési kérdés',x.question)}</div>`:''}</div></details>`).join('')}${!list.length?'<p class="note">Még nincs saját fókusz kijelölve. A „Minden szempont” alatt választhatsz, vagy felvehetsz egy újat.</p>':''}<button class="secondary" id="add-point">Saját szempont hozzáadása</button><details class="panel"><summary class="simple">Mihez kapcsolódnak a kérdések?</summary><p class="muted">Az Omotenashi Manager képzési anyagához: Gemba, Muda, vizuális menedzsment, sztenderdek, 5 Miért, PDCA, Kaizen, munkatársi bevonás és Yokoten. A problémajelzés és vezetői támogatás az Andon és a Respect for People témájához kapcsolódik.</p></details>`;
}
function reflection(){return `<div class="eyebrow">Gyárlátogatás után</div><h1>Mit láttunk?</h1><p class="intro">Vedd elő a saját megfigyeléseidet. Először a konkrétumot rögzítsd, utána gondold végig, mit tanulsz belőle.</p>${recalled()}${myEvidence()}<section class="panel">${area('reflection.fact','Melyik konkrét megfigyelésem volt a legfontosabb?',state.reflection.fact,'Mit láttam, vagy mit mondott a kísérő?')}${area('reflection.meaning','Mi lepett meg? Miért lehet ez hasznos?',state.reflection.meaning)}${area('reflection.expectation','Mire kaptam választ az induló várakozásomból? Mi maradt nyitva?',state.reflection.expectation)}</section>`;}
function kaizen(){return `<div class="eyebrow">Factory Kaizen – Office Kaizen</div><h1>Mit próbálok ki otthon?</h1><p class="intro">Beszéljétek meg csapatban, majd írd fel azt az egy kis változtatást, amelyet a saját kereskedésedben érdemes kipróbálni.</p>${myEvidence()}<section class="panel">${area('kaizen.idea','Melyik gyári ötletből vagy megfigyelésből indulok?',state.kaizen.idea,'Ha ez saját ötlet, azt írd ide.')}${area('kaizen.where','Hol van hasonló helyzet a kereskedésemben?',state.kaizen.where)}${area('kaizen.trial','Milyen apró változtatást próbálok ki?',state.kaizen.trial)}${area('kaizen.signal','Miből fogom észrevenni, hogy jobb lett?',state.kaizen.signal,'Mi változik a kollégának vagy az ügyfélnek? Mit tudok megfigyelni vagy összehasonlítani?')}</section>`;}
function plan(){return `<div class="eyebrow">A teljes képzés tanulságaiból</div><h1>Személyes vezetői tervem</h1><p class="intro">Egy alkalmazható változtatást válassz. Kiindulhatsz a teljes képzésből, a vizsgamunkádból, az esti workshopból vagy a gyárlátogatásból is.</p>${recalled()}<section class="panel">${PLAN_QUESTIONS.map((q,i)=>area('plan.'+i,(i+1)+'. '+q,state.plan[i],i===6?'Konkrét cselekvés és időpont.':'')).join('')}</section>`;}
function coaching(){return `<div class="eyebrow">Páros transzfer</div><h1>A tervem pontosítása</h1><p class="intro">Fejenként 4 perc: 1 perc a tervre, 2 perc segítő kérdésekre, 1 perc a pontosításra. Utána cseréltek. A társad kérdez, te a saját tervedet pontosítod.</p><details class="panel" open><summary class="simple">A saját tervem</summary>${PLAN_QUESTIONS.map((q,i)=>state.plan[i].trim()?`<p><b>${esc(q)}</b></p><p class="feedback">${esc(state.plan[i])}</p>`:'').join('')||'<p class="muted">A Személyes vezetői terv résznél tudod megírni a tervedet.</p>'}</details><section class="panel">${input('coaching.partner','A párom (nem kötelező)',state.coaching.partner)}${COACH_QUESTIONS.map((q,i)=>area('coaching.answers.'+i,q,state.coaching.answers[i])).join('')}${area('plan.6','Az első konkrét lépésem és időpontja, pontosítva',state.plan[6])}</section><p class="note">A vizsgafeladatnak még nincs vége. Most jön a java.</p>`;}
function report(){
 const lines=['TOYOTA OMOTENASHI MANAGER','Kétnapos tanulási napló',state.name?'Név: '+state.name:'',`Utoljára mentve: ${state.updatedAt?new Date(state.updatedAt).toLocaleString('hu-HU'):'–'}`,'','1. TOYOTA ON THE ROAD','Mit szeretnék hazavinni?\n'+(state.road.expectation||'–'),'Tanulási fókuszaim: '+([...state.road.focus,state.road.other].filter(Boolean).join('; ')||'–'),'','2. PÁROS BESZÉLGETÉSEK'];
 state.pairs.forEach((x,i)=>lines.push(`${i+1}. beszélgetés`,x.question,x.partner?'Beszélgetőtárs: '+x.partner:'','Jegyzet: '+(x.note||'–'),''));
 lines.push('3. GYÁRI MEGFIGYELÉSEK');state.observations.forEach(x=>lines.push(x.title+(x.focus?' [saját fókusz]':''),x.question,'Forrás: '+SOURCES[x.source],'Konkrét megfigyelés: '+(x.evidence||'–'),'Kapcsolódás a kereskedésemhez: '+(x.connection||'–'),''));
 lines.push('4. MIT LÁTTUNK?','Legfontosabb megfigyelésem: '+(state.reflection.fact||'–'),'Mi lepett meg, miért lehet hasznos: '+(state.reflection.meaning||'–'),'Válasz az induló várakozásomra / nyitott kérdés: '+(state.reflection.expectation||'–'),'','5. KAIZEN A KERESKEDÉSBEN');
 ['Miből indulok?','Hol alkalmazom?','Milyen kis próbát teszek?','Miből látom, hogy jobb lett?'].forEach((q,i)=>lines.push(q+'\n'+(state.kaizen[['idea','where','trial','signal'][i]]||'–')));
 lines.push('','6. SZEMÉLYES VEZETŐI TERV');PLAN_QUESTIONS.forEach((q,i)=>lines.push(q+'\n'+(state.plan[i]||'–')));
 lines.push('','7. PÁROS TRANSZFER',state.coaching.partner?'Párom: '+state.coaching.partner:'');COACH_QUESTIONS.forEach((q,i)=>lines.push(q+'\n'+(state.coaching.answers[i]||'–')));return lines.filter(x=>x!==null).join('\n');
}
function summary(){return `<h1>Jegyzeteim és mentés</h1><p class="intro">Itt együtt találod a két nap alatt leírtakat. A letöltött biztonsági másolat egy másik eszközön is visszatölthető.</p><section class="panel">${input('name','Név a megosztott jegyzeten (nem kötelező)',state.name)}<div class="actions"><button class="primary" id="download-txt">Jegyzet letöltése</button><button class="secondary" id="print">Nyomtatás / PDF</button></div><div class="button-row"><button class="small-button" id="copy">Szöveg másolása</button><button class="small-button" id="email">Küldés e-mailben</button>${navigator.share?'<button class="small-button" id="share">Megosztás</button>':''}</div><div id="email-help" class="note hidden"></div></section><section class="panel"><h2>Biztonsági másolat</h2><p class="muted">A JSON-fájl a saját szerkesztett szempontjaidat és minden jegyzetedet tartalmazza. Töltsd le a két nap végén, vagy ha másik eszközön folytatnád.</p><div class="actions"><button class="secondary" id="backup">Másolat letöltése</button><button class="secondary" id="restore">Másolat visszatöltése</button></div><input id="import-file" type="file" accept=".json,application/json" class="hidden"><p id="import-message" role="status" class="muted"></p><button class="small-button" id="raw-backup">A jelenlegi helyi mentés letöltése</button></section><section class="panel"><h2>A két nap jegyzetei</h2><div id="report-preview" class="feedback">${esc(report())}</div></section><details class="panel"><summary class="simple">Az app frissítése</summary><p class="muted">A frissítés a jegyzeteidet megőrzi. Az első megnyitáshoz és az új verzió betöltéséhez internet kell. Az offline használat állapotát alul látod.</p><button class="small-button" id="check-update">Új verzió ellenőrzése</button><p class="muted">Verzió: ${APP_VERSION}</p></details><p class="privacy">A jegyzetek a saját böngésződben maradnak, nem kerülnek központi gyűjtőbe. Ugyanazon az eszközön és ugyanazzal a böngészővel nyisd újra az oldalt. A böngésző adatainak törlése a helyi mentést is törli.</p>`;}
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function stamp(){return new Date().toLocaleDateString('sv-SE');}
function bind(){
 document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',()=>{
  const path=el.dataset.field;setAt(path,path.endsWith('.source')?Number(el.value):el.value);save();
  if(path.startsWith('observations.')){const i=Number(path.split('.')[1]);const x=state.observations[i];const title=document.querySelector(`[data-point-title="${i}"]`);if(title)title.textContent=x.title;const question=document.querySelector(`[data-point-question="${i}"]`);if(question)question.textContent=x.question;const badge=document.querySelector(`[data-point-badge="${i}"]`);if(badge)badge.textContent=(x.focus?'Fókusz ':'')+(x.evidence.trim()?'Jegyzetelve':'');if($('point-count'))$('point-count').textContent=state.observations.length+' szempont, '+state.observations.filter(x=>x.evidence.trim()).length+' jegyzettel';}
  if(state.stage===7&&$('report-preview'))$('report-preview').textContent=report();
 }));
 document.querySelectorAll('[data-focus]').forEach(el=>el.onchange=()=>{const value=FOCUS[Number(el.dataset.focus)];state.road.focus=el.checked?[...new Set([...state.road.focus,value])]:state.road.focus.filter(x=>x!==value);save();});
 document.querySelectorAll('details[data-point-id]').forEach(el=>el.ontoggle=()=>{if(el.open)openPoints.add(el.dataset.pointId);else openPoints.delete(el.dataset.pointId);});
 document.querySelectorAll('[data-point-focus]').forEach(el=>el.onchange=()=>{state.observations[Number(el.dataset.pointFocus)].focus=el.checked;save();renderKeepingScroll();});
 document.querySelectorAll('[data-edit-point]').forEach(el=>el.onclick=()=>{const x=state.observations[Number(el.dataset.editPoint)];editing.has(x.id)?editing.delete(x.id):editing.add(x.id);openPoints.add(x.id);renderKeepingScroll();});
 document.querySelectorAll('[data-delete-point]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.deletePoint),x=state.observations[i];if(!confirm('Törlöd ezt a szempontot és a hozzá tartozó jegyzetet?'))return;if(x.template)state.deletedTemplates.push(x.template);state.observations.splice(i,1);save();renderKeepingScroll();});
 document.querySelectorAll('[data-delete-pair]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.deletePair);if(!confirm('Törlöd ezt a beszélgetést és a jegyzetét?'))return;state.pairs.splice(i,1);save();renderKeepingScroll();});
 if($('add-pair'))$('add-pair').onclick=()=>{if(state.pairs.length>=40)return toast('Legfeljebb 40 beszélgetési jegyzetet hozhatsz létre.');state.pairs.push({id:uid(),question:PAIR_QUESTIONS[state.pairs.length%3],partner:'',note:''});save();render();document.querySelectorAll('.panel')[state.pairs.length-1]?.scrollIntoView({block:'start'});};
 if($('add-point'))$('add-point').onclick=()=>{if(state.observations.length>=100)return toast('Legfeljebb 100 megfigyelési szempontot hozhatsz létre.');const x=point();x.focus=true;state.observations.push(x);openPoints.add(x.id);editing.add(x.id);save();render();document.querySelector(`[data-point-id="${x.id}"]`).scrollIntoView({block:'start'});document.querySelector(`[data-field="observations.${state.observations.length-1}.title"]`).focus({preventScroll:true});};
 if($('all-points'))$('all-points').onclick=()=>{focusedOnly=false;renderKeepingScroll();};if($('focused-points'))$('focused-points').onclick=()=>{focusedOnly=true;renderKeepingScroll();};
 if($('download-txt'))$('download-txt').onclick=()=>{save();download('\ufeff'+report(),'Toyota_Omotenashi_jegyzeteim_'+stamp()+'.txt','text/plain;charset=utf-8');};
 if($('backup'))$('backup').onclick=()=>{save();download(JSON.stringify({format:'toyota-omotenashi-notebook',exportedAt:new Date().toISOString(),state},null,2),'Toyota_Omotenashi_biztonsagi_masolat_'+stamp()+'.json','application/json');};
 if($('raw-backup'))$('raw-backup').onclick=()=>{try{download(localStorage.getItem(KEY+'-unreadable')||localStorage.getItem(KEY)||JSON.stringify(state),'Toyota_Omotenashi_helyi_mentes_'+stamp()+'.json','application/json');}catch{toast('A böngésző nem ad hozzáférést a helyi mentéshez. A Másolat letöltése gombot használd.');}};
 if($('restore'))$('restore').onclick=()=>$('import-file').click();if($('import-file'))$('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('A fájl túl nagy. Legfeljebb 2 MB tölthető vissza.');const data=JSON.parse(await f.text());const incoming=data.format==='toyota-omotenashi-notebook'?data.state:data;if(!valid(incoming))throw Error('Ez nem érvényes Omotenashi-napló mentés. A jelenlegi jegyzeteid megmaradtak.');if(!confirm('A betöltés lecseréli a jelenlegi naplódat. Készítettél róla másolatot?'))return;state=incoming;state.stage=7;save();render();toast('A mentést visszatöltöttük.');}catch(error){$('import-message').textContent=error.message;$('import-message').classList.add('error');}finally{if($('import-file'))$('import-file').value='';}};
 if($('print'))$('print').onclick=()=>{$('print-area').innerHTML='<h1>Toyota Omotenashi Manager</h1><div class="print-report"></div>';$('print-area').lastChild.textContent=report();window.print();};
 if($('copy'))$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());toast('A jegyzetet a vágólapra másoltuk.');}catch{const el=$('report-preview');const range=document.createRange();range.selectNodeContents(el);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);toast('Kijelöltük a teljes jegyzetet. A böngésző Másolás parancsával másolhatod.');}};
 if($('email'))$('email').onclick=()=>{const subject='Toyota Omotenashi – '+(state.name||'saját jegyzeteim')+' – '+stamp();const mail='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(report());if(mail.length>7500){const el=$('email-help');el.classList.remove('hidden');el.innerHTML='A teljes jegyzet hosszú a levelezőnek átadott szöveghez. Töltsd le a jegyzetet, és csatold a leveledhez. <div class="button-row"><button class="small-button" id="email-open">Levelező megnyitása</button></div>';$('email-open').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent(subject);};return;}location.href=mail;};
 if($('share'))$('share').onclick=async()=>{try{const file=new File(['\ufeff'+report()],'Toyota_Omotenashi_jegyzeteim.txt',{type:'text/plain'});if(navigator.canShare?.({files:[file]}))await navigator.share({title:'Toyota Omotenashi – jegyzeteim',files:[file]});else await navigator.share({title:'Toyota Omotenashi – jegyzeteim',text:report()});}catch(error){if(error.name!=='AbortError')toast('A megosztás itt nem elérhető. Töltsd le vagy másold a jegyzetet.');}};
 if($('check-update'))$('check-update').onclick=async()=>{try{const reg=await navigator.serviceWorker?.getRegistration();if(!reg){location.reload();return;}await reg.update();if(reg.waiting)offerUpdate(reg.waiting);else toast('Ellenőriztük az elérhető verziót. A jegyzeteid megmaradnak.');}catch{toast('Most nem érhető el új verzió. A jegyzeteiddel tovább dolgozhatsz.');}};
}
function renderKeepingScroll(){const y=scrollY;render();scrollTo(0,y);}
$('stage').onchange=e=>setStage(Number(e.target.value));$('summary-button').onclick=()=>setStage(7);$('prev').onclick=()=>setStage(state.stage-1);$('next').onclick=()=>setStage(state.stage===7?0:state.stage+1);
// Every edit is saved synchronously. Closing an old tab must never write a stale snapshot.
// A second tab must not silently replace notes created in the first tab.
window.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue&&event.newValue!==JSON.stringify(state)){try{const newer=JSON.parse(event.newValue);if(!valid(newer))return;tabConflict=true;storageOK=false;status();}catch{}}});
let offlineReady=false;
function updateOffline(){$('offline-status').textContent=offlineReady?(navigator.onLine?'Offline használatra kész':'Offline, helyi mentéssel'):(navigator.onLine?'Offline előkészítés…':'Nincs internet');}
window.addEventListener('online',updateOffline);window.addEventListener('offline',updateOffline);
function offerUpdate(worker){waitingWorker=worker;const el=$('update-banner');el.classList.remove('hidden');el.innerHTML='Új appverzió érhető el. A jegyzeteid megmaradnak. <button class="small-button" id="apply-update">Frissítés a jegyzeteim megőrzésével</button>';$('apply-update').onclick=()=>{save();if(!storageOK)return toast('Előbb tölts le egy biztonsági másolatot a jegyzeteidről.');worker.postMessage({type:'SKIP_WAITING'});};}
if('serviceWorker' in navigator&&location.protocol!=='file:'){
 let refreshing=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(waitingWorker&&!refreshing){refreshing=true;location.reload();}});
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(async reg=>{
  await navigator.serviceWorker.ready;offlineReady=true;updateOffline();if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);
  reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(worker)worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(worker);});});
 }).catch(()=>{$('offline-status').textContent='A nyitott lapon internet nélkül is jegyzetelhetsz';});
}else{$('offline-status').textContent='Helyi jegyzetelés';}
render();
</script>
</body></html>
