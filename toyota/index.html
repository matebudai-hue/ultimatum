<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eb0a1e"><title>Toyota • Megfigyelés</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f3f4f5;--red:#d9091c}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #155caa;outline-offset:3px}header{background:#fff;border-top:5px solid var(--red);padding:18px 20px}header>div{max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;letter-spacing:1px;color:var(--red)}.tag{font-size:12px;color:#555}main{max-width:740px;margin:auto;padding:24px 20px 135px}h1{font-size:30px;line-height:1.13;margin:10px 0 14px;letter-spacing:-1px}h2{font-size:23px;line-height:1.25}p{line-height:1.5}.muted{color:#60656b;font-size:14px}.eyebrow{font-size:12px;letter-spacing:1.6px;font-weight:bold;color:#686d72;text-transform:uppercase}.panel,.card{background:#fff;border:1px solid #dfe1e4;border-radius:16px;padding:20px;margin:16px 0}.card{scroll-margin-top:24px}.card h3{font-size:18px;line-height:1.35;margin:0 0 12px;display:flex;gap:12px}.num{color:var(--red);font-variant-numeric:tabular-nums}.notice{border-left:3px solid var(--red);background:#fff1f2;padding:12px 14px;font-size:14px;line-height:1.5}.fields{display:grid;gap:16px;grid-template-columns:1fr 1fr}label{display:block;font-weight:bold;font-size:14px}input,textarea{display:block;width:100%;border:1px solid #aeb3b9;border-radius:8px;background:#fff;color:#202124;padding:13px;margin-top:7px;font-size:16px}textarea{min-height:100px;resize:vertical}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}.score{min-height:76px;border:1px solid #b8bdc3;border-radius:10px;background:#fff;color:#373b40;padding:10px 3px;font-size:12px;line-height:1.3}.score b{display:block;font-size:24px;margin-bottom:5px}.score[aria-pressed=true]{background:#202124;color:#fff;border:2px solid #202124;box-shadow:0 0 0 2px #fff,0 0 0 3px #202124}.score[aria-pressed=true] b:after{content:' ✓';font-size:15px}summary{cursor:pointer;font-size:14px;color:#555;padding:6px 0;min-height:36px}details p{font-size:15px;margin:8px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.nav button{flex:1;border:1px solid #c7cbd0;border-radius:8px;min-height:44px;background:white;font-size:13px;padding:8px}.nav button[aria-current=step]{background:#202124;color:#fff;border-color:#202124}.primary,.secondary{border:0;border-radius:10px;padding:15px 20px;min-height:50px;font-weight:bold}.primary{background:var(--red);color:white}.secondary{background:#e9ebee;color:#202124}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:2}.bottom>div{max-width:700px;margin:auto}.progress{height:5px;background:#e4e6e9;border-radius:9px;overflow:hidden;margin:8px 0 12px}.progress span{display:block;background:var(--red);height:100%}.status{font-size:12px;color:#646970;margin:8px 0 0}.result{background:#202124;color:white;padding:28px;border-radius:18px}.result h1{font-size:64px;margin:12px 0}.result h1 small{font-size:24px;color:#bec1c5}.badge{display:inline-block;padding:8px 12px;border-radius:7px;background:#fff;color:#202124;font-weight:bold}.result.pass .badge{background:#bce7cd;color:#113c25}.rows{list-style:none;padding:0}.rows li{padding:13px 0;border-bottom:1px solid #e3e5e7;display:flex;gap:12px;line-height:1.4}.rows li span{flex:1}.rows li b{white-space:nowrap}.error{color:#a50918;font-weight:bold}.hidden{display:none!important}.feedback{white-space:pre-wrap;overflow-wrap:anywhere}footer{font-size:12px;color:#6a6e73;margin-top:24px;line-height:1.5} @media(max-width:420px){main{padding:20px 14px 145px}.fields{grid-template-columns:1fr}.card{padding:17px 14px}.nav button{font-size:12px;padding:7px 4px}h1{font-size:28px}}@media print{header,.bottom,.nav,.noprint,footer{display:none!important}body{background:white}main{padding:0;max-width:none}.panel,.result{break-inside:avoid}.result{background:white;color:black;border:2px solid black}.result h1 small{color:black}}
</style></head><body><header><div><span class="brand">TOYOTA</span><span class="tag">ÜZLETI ÉRTÉKESÍTÉS<br>Megfigyelés és visszajelzés</span></div></header><main id="app"></main><div class="bottom" id="bottom"></div><script>
'use strict';
const ITEMS=[{"title": "Felkészülés a cégből és a partnerből", "help": "A beszélgetés alapján mennyire látszik, hogy ismeri a céget és a tárgyalópartnerét? Figyeld, használ-e konkrét, releváns információkat, és kapcsolja-e ezeket az ügyfél helyzetéhez."}, {"title": "Tudatos beszélgetési felkészülés", "help": "A beszélgetés alapján mennyire látszik az átgondolt felkészülés? Figyeld, vannak-e célzott kérdései, tudja-e, mit szeretne megtudni, és használ-e a helyzethez illő kapcsolódási pontokat."}, {"title": "Kapcsolatteremtés", "help": "Köszöntsd és szólítsd meg az ügyfelet. Figyelmed, testbeszéded és a beszélgetés kezdése igazodjon hozzá. Reagálj arra, amit mond és ahogyan jelen van."}, {"title": "Cél, menet és időkeret", "help": "Egyeztesd, mi a találkozó célja, hogyan fogtok haladni és mennyi időtök van. Kérdezd meg, ő mit szeretne elérni a beszélgetés végére."}, {"title": "Bemutatkozás és pozicionálás", "help": "Röviden mutasd be magadat, a márkakereskedést és a Toyota releváns értékeit. Derüljön ki, miben tudtok segíteni ennek az üzleti ügyfélnek."}, {"title": "Céghelyzet, kihívások és tervek", "help": "Ismerd meg a cég működését, kihívásait és terveit. Kérdezz rá, ezek hogyan befolyásolják az autóhasználatot és a flottával kapcsolatos döntéseket."}, {"title": "A flotta szerepe és használata", "help": "Tisztázd, kik, mire és milyen körülmények között használják az autókat. Ismerd meg a releváns összetételt és futásteljesítményt."}, {"title": "Üzemeltetés és finanszírozás", "help": "Kérdezz rá a jelenlegi flottaüzemeltetőre és finanszírozási konstrukcióra. Tudd meg, milyen szempontok alapján tartanák meg vagy változtatnának rajta."}, {"title": "Elégedettség és problémák", "help": "Kérj konkrét példákat arra, mi működik jól, mi hiányzik vagy okoz nehézséget a flottánál és a szolgáltatásoknál. Tisztázd a következményeket is."}, {"title": "Kötelező és választható elvárások", "help": "Különítsd el a kizáró feltételeket (KO kritériumokat) a „jó, ha van” igényektől. Ellenőrizd, mely szempontok a legfontosabbak az ügyfélnek."}, {"title": "Döntési folyamat és időzítés", "help": "Tisztázd a partnered szerepét, a további érintetteket, a döntés menetét és időzítését. Derüljön ki, mikorra tervezik az autók beszerzését."}, {"title": "Smart Talk és személyes kapcsolódás", "help": "Természetes kapaszkodóból indulva ismerd meg a partnert emberként is. Építs a válaszaira, saját tapasztalataira és számára fontos szempontokra. Tartsd tiszteletben a határait."}, {"title": "Aktív figyelem és továbbkérdezés", "help": "Használj nyitott kérdéseket, pontosíts és kérdezz tovább a válaszok alapján. Hagyj időt a megszólalásra. Jelezd vissza, mit értettél meg."}, {"title": "Ügyfélre szabott autóbemutatás", "help": "A feltárt prioritások alapján válaszd ki, mit és milyen sorrendben mutatsz meg. Mondd ki, melyik részlet hogyan kapcsolódik az ügyfél elmondott igényéhez."}, {"title": "Tulajdonságból ügyfélelőny", "help": "Mutasd meg, egy felszereltség vagy műszaki megoldás hogyan segíti a cég működését, illetve az autó használójának mindennapjait. Használj konkrét haszonérveket."}, {"title": "Bevonás és kipróbálás", "help": "Az ügyfél maga is próbáljon ki számára fontos részleteket. Hagyj teret a felfedezésnek, figyeld a reakcióit, és azokhoz igazítsd a bemutatás folytatását."}, {"title": "Élmény és érzések megfogalmazása", "help": "Konkrét kipróbálás után kérdezz rá a személyes élményére: például „Milyen érzés volt?” Hagyj csendet, majd a válaszából kiindulva kérdezz tovább."}, {"title": "Kérdések és bizonytalanságok kezelése", "help": "Szükség esetén pontosítsd az ügyfél kérdését, adj hiteles, releváns választ, és ellenőrizd, segített-e. Amit nem tudsz, annak konkrét utánajárást vállalj."}, {"title": "Összefoglalás és visszaellenőrzés", "help": "Kapcsold össze a fő igényeket a bemutatott megoldással. Jelezd a nyitott kérdéseket, és ellenőrizd az ügyféllel, hogy jól értetted-e a helyzetét."}, {"title": "Megállapodás a következő lépésről", "help": "Közösen rögzítsétek, ki, mit és mikorra tesz. Legyen egyértelmű, hogyan és mikor folytatjátok az egyeztetést."}];
const GROUPS=[{name:'Felkészülés',start:0,end:2},{name:'Indítás',start:2,end:5},{name:'Igényfeltárás',start:5,end:13},{name:'Bemutatás',start:13,end:18},{name:'Lezárás',start:18,end:20}];
const LABELS=['Nem látható','Részben látható','Rendben van'];
const KEY='toyota-observation-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return {scores:Array(20).fill(null),seller:'',observer:'',date:new Date().toLocaleDateString('sv-SE'),notes:'',step:-1,done:false};}
function valid(s){return s&&Array.isArray(s.scores)&&s.scores.length===20&&s.scores.every(v=>v===null||[0,1,2].includes(v))&&['seller','observer','date','notes'].every(k=>typeof s[k]==='string')&&Number.isInteger(s.step)&&s.step>=-1&&s.step<=4&&typeof s.done==='boolean';}
let state=fresh(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved;}catch{storageOK=false;}
if(state.done&&state.scores.includes(null))state.done=false;
function count(){return state.scores.filter(v=>v!==null).length;}
function total(){return state.scores.reduce((a,b)=>a+(b??0),0);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}const el=$('save');if(el)el.textContent=storageOK?'Automatikusan mentve ezen az eszközön.':'A böngésző nem engedi a mentést. A lap bezárása előtt töltsd le az eredményt.';}
function go(step){state.step=step;state.done=false;save();render();window.scrollTo(0,0);}
function field(k,label,type='text'){return `<label>${label}<input id="${k}" type="${type}" value="${esc(state[k])}" maxlength="120"></label>`;}
function bindFields(){for(const k of ['seller','observer','notes'])if($(k))$(k).addEventListener('input',e=>{state[k]=e.target.value;save();});}
function bottom(){const n=count();$('bottom').innerHTML=`<div><div class="muted" aria-live="polite">${n} / 20 szempont értékelve</div><div class="progress"><span style="width:${n*5}%"></span></div><div class="actions">${state.step>=0?'<button class="secondary" id="prev">Vissza</button>':''}<button class="primary" id="next">${state.step<0?'Megfigyelés indítása':state.step===4?'Értékelés befejezése':'Következő szakasz →'}</button></div><div class="status" id="save"></div></div>`;if($('prev'))$('prev').onclick=()=>go(state.step-1);$('next').onclick=()=>state.step===4?finish():go(state.step+1);save();}
function render(){
 $('bottom').classList.toggle('hidden',state.done);
 if(state.done){result();return;}
 if(state.step===-1){$('app').innerHTML=`<div class="eyebrow">Társmegfigyelés · 20 szempont</div><h1>Figyeld meg.<br>Adj visszajelzést.</h1><p>Üzleti ügyfélszituáció és autóbemutatás. Minden szempontnál jelöld, mit láttál a társad viselkedéséből.</p><div class="panel"><div class="fields">${field('seller','Megfigyelt értékesítő')}${field('observer','Megfigyelő')}</div><p class="muted">Az adatok megadása nem kötelező.</p></div><div class="panel"><h2>Így pontozz</h2><p><b>0 · Nem látható</b><br>Nem jelenik meg, vagy nem éri el a célját.</p><p><b>1 · Részben látható</b><br>Érdemi, de hiányos megvalósítás.</p><p><b>2 · Rendben van</b><br>Önálló, ügyfélhez illő, megfelelő megvalósítás.</p><p class="muted">Minden szempont azonos súlyú. Maximum 40 pont; 25 ponttól megfelelt.</p></div><div class="notice">Mind a 20 szempontot a látott beszélgetés alapján értékeld. Az első két pontnál is azt figyeld, mennyire látszik a felkészültség.</div><footer>Az értékelés ezen a böngészőn belül marad, nem kerül szerverre. Megnyitás után internet nélkül is kitölthető, amíg a lap nyitva van.</footer>`;
 }else{const g=GROUPS[state.step];$('app').innerHTML=`<div class="eyebrow">${state.step+1}. szakasz / 5</div><h1>${g.name}</h1><nav class="nav" aria-label="Szakaszok">${GROUPS.map((g,i)=>`<button data-go="${i}" ${i===state.step?'aria-current="step"':''}>${i+1}. ${g.name}</button>`).join('')}</nav>${state.step===0?'<div class="notice">A beszélgetésben látható felkészültséget értékeld: mit használ az értékesítő a cég és a partner ismeretéből, és mennyire átgondoltak a kérdései?</div>':''}<p class="muted">Érints meg egy pontszámot. A „Mit figyeljek?” alatt a megfigyelési útmutató segít.</p><div id="error" role="alert"></div>${ITEMS.slice(g.start,g.end).map((it,j)=>{const i=g.start+j;return `<section class="card" id="card-${i}"><h3 id="title-${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(it.title)}</span></h3><details><summary>Mit figyeljek?</summary><p>${esc(it.help)}</p></details><div class="scores" role="group" aria-labelledby="title-${i}">${LABELS.map((l,v)=>`<button class="score" data-index="${i}" data-value="${v}" aria-pressed="${state.scores[i]===v}"><b>${v}</b>${l}</button>`).join('')}</div></section>`;}).join('')}${state.step===4?`<div class="panel"><label>Konkrét megfigyelés / visszajelzés<textarea id="notes" placeholder="Mit láttál vagy hallottál? Mi működött, min érdemes változtatni?">${esc(state.notes)}</textarea></label></div>`:''}`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));
 document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.index);state.scores[i]=Number(b.dataset.value);document.querySelectorAll(`[data-index="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.value)===state.scores[i]));save();bottom();});
 }bindFields();bottom();
}
function finish(){const missing=state.scores.findIndex(v=>v===null);if(missing!==-1){go(GROUPS.findIndex(g=>missing>=g.start&&missing<g.end));$('error').innerHTML=`<p class="error">Még ${20-count()} szempont hiányzik. Értékeld mind a 20-at az eredményhez.</p>`;$('card-'+missing).scrollIntoView({block:'center'});return;}state.date=new Date().toLocaleDateString('sv-SE');state.done=true;save();render();window.scrollTo(0,0);}
function report(){return ['TOYOTA – Megfigyelés és visszajelzés',`Értékesítő: ${state.seller||'–'}`,`Megfigyelő: ${state.observer||'–'}`,`Dátum: ${state.date}`,`Eredmény: ${total()}/40 – ${total()>=25?'Megfelelt':'Nem felelt meg'}`,'Megfelelési határ: 25 pont.','',...ITEMS.map((it,i)=>`${i+1}. ${it.title}: ${state.scores[i]}/2 – ${LABELS[state.scores[i]]}`),'','Konkrét megfigyelés / visszajelzés:',state.notes||'–'].join('\n');}
function result(){const score=total();$('app').innerHTML=`<div class="eyebrow">Megfigyelés lezárva</div><div class="result ${score>=25?'pass':''}"><div>${esc(state.seller||'Az értékelés eredménye')}</div><h1>${score}<small> / 40 pont</small></h1><span class="badge">${score>=25?'Megfelelt':'Nem felelt meg'}</span><p>Megfelelési határ: 25 pont${score<25?` · Még ${25-score} pont szükséges.`:'.'}</p></div><p class="muted">${esc(state.date)} · Megfigyelő: ${esc(state.observer||'–')}</p><div class="noprint"><button class="primary" id="email" style="width:100%;margin-bottom:10px">Küldés e-mailben</button><p class="muted">A leveleződben megnyílik a teljes értékelés. Add meg a címzettet, majd küldd el. Ha nem nyílik meg, töltsd le az eredményt, és csatold a leveledhez.</p></div><div class="actions noprint"><button class="secondary" id="download">Eredmény letöltése</button><button class="secondary" id="print">Nyomtatás / PDF</button></div><div class="panel"><h2>Szempontonkénti eredmény</h2><ul class="rows">${ITEMS.map((it,i)=>`<li><span><span class="num">${i+1}.</span> ${esc(it.title)}<br><small class="muted">${LABELS[state.scores[i]]}</small></span><b>${state.scores[i]} / 2</b></li>`).join('')}</ul></div><div class="panel"><h2>Konkrét visszajelzés</h2><p class="feedback">${esc(state.notes||'Nem került szöveges visszajelzés az értékeléshez.')}</p></div><div class="actions noprint"><button class="secondary" id="edit">Értékelés javítása</button><button class="primary" id="reset">Új megfigyelés</button></div><footer>Az új megfigyelés felülírja ezt a helyi értékelést. Előtte töltsd le, ha meg szeretnéd őrizni. A letöltés szövegfájlt készít; a Nyomtatás / PDF gomb a böngésző nyomtatási lehetőségeit nyitja meg.</footer>`;
 $('email').onclick=()=>{const subject='Toyota megfigyelés – '+(state.seller||'Értékelés')+' – '+state.date;window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(report());};
 $('edit').onclick=()=>go(0);$('print').onclick=()=>window.print();$('download').onclick=()=>{const url=URL.createObjectURL(new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Toyota_megfigyeles_'+state.date+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};$('reset').onclick=()=>{if(!confirm('Új megfigyelést kezdesz? A jelenlegi értékelés helyi példánya törlődik. Előtte töltsd le, ha meg szeretnéd őrizni.'))return;state=fresh();save();render();window.scrollTo(0,0);};
}
render();
</script></body></html>
