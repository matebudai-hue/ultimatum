 const headers={apikey:publicKey,'Content-Type':'application/json'};
 if(token)headers.Authorization='Bearer '+token;
 const res=await fetch(apiRoot+path,{method:method||(body===undefined?'GET':'POST'),headers,body:body===undefined?undefined:JSON.stringify(body)});

 if(!res.ok)throw Error(data?.message||data?.msg||data?.error_description||'Sikertelen kérés.');

 $('app').innerHTML=`<h1>Adminbelépés</h1><div class="panel"><form id="adminForm"><label>E-mail<input id="mail" type="email" autocomplete="username" required></label><label>Jelszó<input id="pw" type="password" autocomplete="current-password" required></label><button class="primary" type="submit" id="login">Belépés</button></form><p id="authMsg" role="status"></p><details id="activation"><summary>Fiók aktiválása</summary><p>Ha már regisztráltál, erősítsd meg a címed a regisztrációs levélben. Ezután itt léphetsz be a megadott jelszóval.</p><button class="secondary" id="resend">Új megerősítő levél kérése</button><details><summary>A levélben lévő gomb nem működik</summary><p>Másold ki a legutóbbi levél megerősítő gombjának hivatkozását, és illeszd ide.</p><label>Megerősítő hivatkozás<input id="confirmUrl" type="password" autocomplete="off"></label><button id="verify">Cím megerősítése</button></details></details><details><summary>Első regisztráció</summary><p>Add meg fent az adminisztrátori e-mail-címed és a választott jelszót.</p><button id="register">Fiók létrehozása</button></details></div><a href="./">Megfigyelés indítása</a>`;
 const credentials=()=>({email:$('mail').value.trim(),password:$('pw').value});
 const redirect='?redirect_to='+encodeURIComponent(location.href.split('#')[0]+'?admin=1');
 function authAction(id,fn){
  $(id).onclick=async e=>{
   e.preventDefault();const b=e.currentTarget;b.disabled=true;$('authMsg').textContent='Egy pillanat…';
   try{await fn();}
   catch(err){
    const msg=err.message;
    if(/rate limit|too many|after \d+ seconds/i.test(msg))$('authMsg').textContent='A levélküldés átmenetileg korlátozott. Használd a legutóbbi megerősítő levelet, vagy próbáld meg később.';
    else if(/not confirmed|invalid login credentials/i.test(msg)){$('activation').open=true;$('authMsg').textContent='A belépés nem sikerült. Ellenőrizd a jelszót, és ha még nem tetted, erősítsd meg az e-mail-címed.';}
    else $('authMsg').textContent=msg;
   }finally{b.disabled=false;}
  };
 }
 async function enter(session){
  access=session.access_token;
  if(!await api('/rest/v1/rpc/toyota_admin_access',{})){access='';throw Error('Ehhez a fiókhoz nincs adminjog.');}
  await dashboard();
 }
 authAction('login',async()=>{if(!$('adminForm').reportValidity())throw Error('Add meg az e-mail-címed és a jelszavad.');await enter(await api('/auth/v1/token?grant_type=password',credentials()));});
 $('adminForm').onsubmit=e=>{e.preventDefault();$('login').click();};
 authAction('register',async()=>{if(!$('adminForm').reportValidity())throw Error('Add meg az e-mail-címed és a jelszavad.');await api('/auth/v1/signup'+redirect,credentials());$('activation').open=true;$('authMsg').textContent='A következő lépés az e-mail-címed megerősítése. Ellenőrizd a levélszemét mappát is.';});
 authAction('resend',async()=>{if(!$('mail').reportValidity())throw Error('Add meg az adminisztrátori e-mail-címed.');await api('/auth/v1/resend'+redirect,{type:'signup',email:credentials().email});$('authMsg').textContent='Megerősítő levél kérve. A legújabb levél hivatkozását használd.';});
 authAction('verify',async()=>{
  let u;try{u=new URL($('confirmUrl').value.trim());}catch{throw Error('A levélben lévő megerősítő gomb teljes hivatkozását illeszd be.');}
  const token=u.searchParams.get('token');
  if(u.origin!==apiRoot||u.pathname!=='/auth/v1/verify'||!token||u.searchParams.get('type')!=='signup')throw Error('Ez nem a Toyota-projekt regisztrációs hivatkozása.');
  $('confirmUrl').value='';
  await enter(await api('/auth/v1/verify',{token_hash:token,type:'signup'}));
 });
}

function parseRoster(text){
 const names=[],contacts={};
 for(const line of text.split(/\r?\n/)){
  if(!line.trim())continue;
  const parts=line.split(/[\t;,]/).map(v=>v.trim().replace(/^"|"$/g,''));
  const name=parts[0], email=parts[1]||'';
  if(!name||names.includes(name))throw Error('Minden név egyszer szerepeljen. Azonos nevű résztvevőknél adj megkülönböztető jelölést.');
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw Error('Hibás e-mail-cím: '+name);
  names.push(name);if(email)contacts[name]=email;
 }
 return {names,contacts};
}
function criterionMeans(cls,records){
 const people=cls.roster.map(n=>records.filter(r=>r.seller===n)).filter(rows=>rows.length);
 if(!people.length)return [];
 return exams[cls.kind].items.map((it,i)=>({title:it.title,mean:people.reduce((sum,rows)=>sum+rows.reduce((a,r)=>a+r.scores[i],0)/rows.length,0)/people.length})).sort((a,b)=>b.mean-a.mean);
}
function groupReport(cls,occasion,records){
 const rank=criterionMeans(cls,records);
 const format=r=>r.title+' · '+r.mean.toLocaleString('hu-HU',{maximumFractionDigits:2})+'/2';
 const observed=new Set(records.map(r=>r.seller)).size;
 return [cls.name,modeName(occasion.mode)+' · '+occasion.name,'Összesítés ideje: '+new Date().toLocaleString('hu-HU'),'Megfigyelt résztvevők: '+observed+'/'+cls.roster.length,'Beküldések: '+records.length,'',...(rank.length?['Legmagasabb értékelések',...rank.filter(r=>Math.abs(r.mean-rank[0].mean)<1e-9).map(format),'','Legalacsonyabb értékelések',...rank.filter(r=>Math.abs(r.mean-rank.at(-1).mean)<1e-9).map(format),'','Minden szempont',...rank.map(format)]:['Még nincs beküldés.'])].join('\n');
}

let adminTab='overview', refreshTimer=null, dashboardRequest=0, adminActive=false, refreshedAt=null, rosterDirty=false;
function leaveRoster(){return !rosterDirty||confirm('A névsor módosításai még nincsenek mentve. Elhagyod ezt a nézetet?');}
function localStamp(value){return new Date(value).toLocaleString('hu-HU',{timeZone:'Europe/Budapest'});}
function modal(title,body){

function criterionChart(cls,records){
 const rank=criterionMeans(cls,records);
 if(!rank.length)return '<p class="empty">A szempontok összesítése az első beküldés után jelenik meg.</p>';
 return '<p class="muted">Átlag 0–2 pont között · minden megfigyelt értékesítő azonos súllyal szerepel</p><div class="criteria">'+rank.map((r,i)=>'<div class="criterion"><span>'+esc(r.title)+'</span><div class="bar"><i style="width:'+r.mean*50+'%"></i></div><b>'+r.mean.toLocaleString('hu-HU',{maximumFractionDigits:2})+'</b></div>').join('')+'</div>';
}
function adminOverview(cls,occasion,records){
 const observed=new Set(records.map(r=>r.seller)).size,rank=criterionMeans(cls,records);
 const score=r=>r.scores.reduce((a,b)=>a+b,0);
 const strong=rank.length?rank.filter(r=>Math.abs(r.mean-rank[0].mean)<1e-9):[];
 const weak=rank.length?rank.filter(r=>Math.abs(r.mean-rank.at(-1).mean)<1e-9):[];
 function highlight(title,rows,style){
 return '<section class="panel '+style+'"><h2>'+title+'</h2>'+(rows.length?'<b class="metric">'+rows[0].mean.toLocaleString('hu-HU',{maximumFractionDigits:2})+'<small> / 2</small></b><ul>'+rows.map(r=>'<li>'+esc(r.title)+'</li>').join('')+'</ul>':'<p>Az első beküldésre várunk.</p>')+'</section>';
 }
 return '<div class="stats"><section class="panel"><span>Megfigyelt értékesítők</span><b class="metric">'+observed+'<small> / '+cls.roster.length+'</small></b></section><section class="panel"><span>Beküldött értékelések</span><b class="metric">'+records.length+'</b></section><section class="panel"><span>'+ (occasion.mode==='exam'?'Megfelelt értékelések':'Értékelések átlaga')+'</span><b class="metric">'+(occasion.mode==='exam'?records.filter(r=>score(r)>=25).length+'<small> / '+records.length+'</small>':records.length?(records.reduce((sum,r)=>sum+score(r),0)/records.length).toLocaleString('hu-HU',{maximumFractionDigits:1})+'<small> / 40</small>':'—')+'</b></section></div><div class="highlights">'+highlight('Legmagasabb értékelés',strong,'strong')+highlight('Legalacsonyabb értékelés',weak,'weak')+'</div><section class="panel"><div class="section-head"><h2>Legutóbbi beküldések</h2><button class="secondary" id="seeResults">Minden eredmény</button></div>'+resultsTable(cls,occasion,[...records].sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,5),false)+'</section><section class="panel"><h2>A 20 szempont eredménye</h2>'+criterionChart(cls,records)+'</section>';
}
function resultsTable(cls,occasion,records,includeMissing=true){
 const rows=records.map(r=>{
 const total=r.scores.reduce((a,b)=>a+b,0);
 return '<tr><td><button class="text-button" data-person="'+esc(r.seller)+'">'+esc(r.seller)+'</button></td><td>'+esc(r.observers.name)+'</td><td><b>'+total+'/40</b></td><td>'+(occasion.mode==='exam'?'<span class="pill '+(total>=25?'ok':'low')+'">'+(total>=25?'Megfelelt':'Nem felelt meg')+'</span>':'Megfigyelés')+'</td><td>'+localStamp(r.created_at)+'</td></tr>';
 });
 if(includeMissing)for(const name of cls.roster)if(!records.some(r=>r.seller===name))rows.push('<tr><td>'+esc(name)+'</td><td colspan="4" class="muted">Még nincs beküldés</td></tr>');
 return '<div class="table-scroll"><table><thead><tr><th>Értékesítő</th><th>Megfigyelő</th><th>Pontszám</th><th>Eredmény</th><th>Beküldés időpontja</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}
function showPerson(cls,occasion,name,records){

 const heads=rows.map(r=>'<th>'+esc(r.observers.name)+'<br><small>'+localStamp(r.created_at)+'</small></th>').join('');
 modal(name+' · értékelések összehasonlítása','<div class="table-scroll"><table><thead><tr><th>Szempont</th>'+heads+'</tr></thead><tbody>'+items.map((it,i)=>'<tr><th>'+esc(it.title)+'</th>'+rows.map(r=>'<td>'+r.scores[i]+' / 2<br><small>'+LABELS[r.scores[i]]+'</small></td>').join('')+'</tr>').join('')+'<tr><th>Összesen</th>'+rows.map(r=>{const n=r.scores.reduce((a,b)=>a+b,0);return '<td><b>'+n+'/40</b>'+(occasion.mode==='exam'?'<br>'+(n>=25?'Megfelelt':'Nem felelt meg'):'')+'</td>';}).join('')+'</tr><tr><th>Szöveges visszajelzés</th>'+rows.map(r=>'<td class="feedback">'+esc(r.notes||'—')+'</td>').join('')+'</tr></tbody></table></div>');

st vagy a vizsgát. A közös QR-kód rögtön elkészül.</p><p><a href="./#preview=1&kind=fleet" target="_blank" rel="noopener">Flottás előnézet ↗</a> · <a href="./#preview=1&kind=passenger" target="_blank" rel="noopener">Személyautós előnézet ↗</a></p></section>')+'</div>';

 $('projectSummary').onclick=()=>{const d=modal(cls.name+' · '+modeName(occasion.mode)+' · '+occasion.name,'<p>'+new Set(entries.map(r=>r.seller)).size+'/'+cls.roster.length+' értékesítő · '+entries.length+' beküldés</p>'+criterionChart(cls,entries));d.classList.add('projection');};
 $('mailSummary').onclick=()=>emailSummary(cls,occasion,entries);

function drawQr(canvas,link){
 const qr=new ToyotaQRCode(-1,0);qr.addData(link);qr.make();const n=qr.getModuleCount();
 canvas.width=canvas.height=(n+8)*12;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))ctx.fillRect((x+4)*12,(y+4)*12,12,12);
}
function emailSummary(cls,occasion,records){
 const recipients=cls.roster.map(n=>cls.contacts?.[n]).filter(Boolean),subject=cls.name+' · '+modeName(occasion.mode)+' · '+occasion.name;

 const dialog=modal('Összesítés küldése','<p>'+recipients.length+' címzett. A címek titkos másolatba kerülnek.</p><label>A levél szövege<textarea id="mailBody" rows="14"></textarea></label><p><button class="primary" id="openMail">Megnyitás a levelezőben</button></p>');
 dialog.querySelector('textarea').value=body;
 dialog.querySelector('#openMail').onclick=()=>{location.href='mailto:?bcc='+encodeURIComponent(recipients.join(','))+'&subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(dialog.querySelector('textarea').value);};
}

 draw();$('addPerson').onclick=()=>{draft.push({original:null,name:'',email:''});rosterDirty=true;draw();};
 $('pasteRoster').onclick=()=>{const d=modal('Névsor beillesztése','<p>Soronként egy név és opcionális e-mail-cím. Excelből két oszlopot is bemásolhatsz. A már meglévő nevekhez tartozó e-mail-címek frissülnek.</p><textarea id="pasteText" rows="10"></textarea><p><button class="primary" id="applyPaste">Beillesztés</button></p>');d.querySelector('#applyPaste').onclick=()=>{try{const p=parseRoster(d.querySelector('textarea').value);for(const name of p.names){const existing=draft.find(x=>x.name===name);if(existing)existing.email=p.contacts[name]||'';else draft.push({original:null,name,email:p.contacts[name]||''});}rosterDirty=true;draw();d.close();}catch(e){alertError(e);}};};
 action('saveRoster',async()=>{const parsed=parseRoster(draft.map(p=>p.name.trim()+String.fromCharCode(9)+p.email.trim()).join(String.fromCharCode(10)));if(parsed.names.length!==draft.length)throw Error('Minden résztvevőnek adj nevet.');

 return;
 }
 if(!occasion){content.innerHTML='<section class="panel"><h2>Hozz létre egy alkalmat</h2><p>A megfigyeléshez vagy vizsgához saját QR-kód és eredménylista tartozik.</p></section>';return;}
 if(adminTab==='overview'){

 }else{
 content.innerHTML='<section class="panel"><div class="section-head"><h2>Egyéni eredmények</h2><select id="scope" aria-label="Eredmények köre"><option value="current">Aktuális alkalom</option><option value="practice">Az osztály összes megfigyelése</option><option value="exam">Az osztály összes vizsgája</option></select></div><p class="muted">Kattints az értékesítő nevére a megfigyelők értékeléseinek összehasonlításához.</p><div id="resultRecords">'+resultsTable(cls,occasion,entries)+'</div></section>';

 }
 bindPeople(cls,occasion,entries);
}
function bindPeople(cls,occasion,records){document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>showPerson(cls,occasion,b.dataset.person,records));}
function createClassDialog(){
 const d=modal('Új osztály','<label>Osztály neve<input id="className" placeholder="Például Toyota · november"></label><div class="fields"><label>Értékesítés típusa<select id="kind"><option value="fleet">Flotta</option><option value="passenger">Személyautó</option></select></label><label>Első alkalom<select id="firstMode"><option value="practice">Megfigyelés</option><option value="exam">Vizsga</option></select></label></div><label>Névsor<textarea id="roster" rows="8" placeholder="Név és opcionális e-mail-cím · soronként egy résztvevő"></textarea></label><p class="muted">Excelből két oszlop is beilleszthető.</p><label>Vagy TXT / CSV feltöltése<input id="file" type="file" accept=".txt,.csv"></label><p><button class="primary" id="saveClass">Osztály és QR-kód létrehozása</button></p>');
 d.querySelector('#file').onchange=async e=>{if(e.target.files[0])d.querySelector('#roster').value=await e.target.files[0].text();};
 action('saveClass',async()=>{const name=$('className').value.trim(),p=parseRoster($('roster').value);if(!name||!p.names.length)throw Error('Adj nevet az osztálynak és illeszd be a névsort.');const result=await api('/rest/v1/rpc/create_observation_class',{class_name:name,class_kind:$('kind').value,names:p.names,emails:p.contacts,occasion_mode:$('firstMode').value});classId=result.class_id;occasionId=result.occasion_id;adminTab='overview';d.close();await dashboard();});
}
function createOccasionDialog(cls){
 const d=modal('Új alkalom · '+cls.name,'<label>Alkalom neve vagy dátuma<input id="occasionName" value="'+new Date().toLocaleDateString('hu-HU')+'"></label><label>Cél<select id="mode"><option value="practice">Megfigyelés</option><option value="exam">Vizsga</option></select></label><p><button class="primary" id="saveOcc">Alkalom és QR-kód létrehozása</button></p>');
 action('saveOcc',async()=>{const id=crypto.randomUUID();await api('/rest/v1/occasions',{id,class_id:cls.id,name:$('occasionName').value.trim(),mode:$('mode').value});occasionId=id;adminTab='overview';d.close();await dashboard();});
}
function scheduleRefresh(){
 clearTimeout(refreshTimer);
 refreshTimer=setTimeout(async()=>{
 if(!adminActive)return;
 const target=occasionId,cls=classes.find(c=>c.id===classId),occasion=occasions.find(a=>a.id===target);
 if(!document.hidden&&occasion){
 try{const loaded=await readEntries(target);if(target===occasionId){
 entries=loaded;refreshedAt=new Date();if($('liveStatus'))$('liveStatus').textContent='Frissítve '+localStamp(refreshedAt)+' · automatikus frissítés 20 mp';
 if(!document.querySelector('dialog[open]')&&adminTab==='overview')renderAdminContent(cls,occasion);
 if(!document.querySelector('dialog[open]')&&adminTab==='results'&&$('scope')?.value==='current')renderAdminContent(cls,occasion);
 }}catch(err){if($('liveStatus'))$('liveStatus').textContent='A frissítés nem sikerült. Próbáld a Frissítés gombbal.';}
 }scheduleRefresh();
 },20000);
}

async function readEntries(id){
 const all=[];for(let offset=0;;offset+=500){const page=await api('/rest/v1/observations?select=*,observers!inner(occasion_id,name)&observers.occasion_id=eq.'+id+'&order=created_at,id&limit=500&offset='+offset);all.push(...page);if(page.length<500)return all;}
}
function overview(cls,occasion,records){
 const items=exams[cls.kind].items, sums=Array(20).fill(0);let observed=0;
 const people=cls.roster.map(name=>{
  const rows=records.filter(r=>r.seller===name);
  if(rows.length){observed++;items.forEach((_,i)=>sums[i]+=rows.reduce((sum,r)=>sum+r.scores[i],0)/rows.length);}
  return `<details class="card"><summary>${esc(name)} · ${rows.length} megfigyelés</summary>${rows.map(r=>{
   const total=r.scores.reduce((a,b)=>a+b,0);
   return `<details><summary>${esc(r.observers.name)} · ${total}/40${occasion.mode==='exam'?' · '+(total>=25?'Megfelelt':'Nem felelt meg'):''}</summary><p>${new Date(r.created_at).toLocaleString('hu-HU')}${cls.kind==='passenger'?' · Telefon: '+r.scores.slice(0,5).reduce((a,b)=>a+b,0)+'/10 · Bemutatás: '+r.scores.slice(5).reduce((a,b)=>a+b,0)+'/30':''}</p><ol>${items.map((it,i)=>`<li>${esc(it.title)} · ${r.scores[i]}/2</li>`).join('')}</ol><p class="feedback">${esc(r.notes)}</p></details>`}).join('')}</details>`;
 });
 const rank=items.map((it,i)=>({title:it.title,mean:sums[i]/observed})).sort((a,b)=>b.mean-a.mean);
 const level=r=>r.mean.toLocaleString('hu-HU',{maximumFractionDigits:2})+'/2';
 const ties=target=>rank.filter(r=>Math.abs(r.mean-target)<1e-9).map(r=>esc(r.title)).join(', ');
 return `<div class="panel"><h2>${modeName(occasion.mode)} · beérkezett eredmények</h2><p>Frissítve: ${new Date().toLocaleString("hu-HU")}</p><p>${observed}/${cls.roster.length} értékesítő · ${records.length} beküldés</p>${observed?`<p><b>Legmagasabb · ${level(rank[0])}</b><br>${ties(rank[0].mean)}</p><p><b>Legalacsonyabb · ${level(rank[19])}</b><br>${ties(rank[19].mean)}</p><details><summary>Mind a 20 szempont átlaga</summary><p>Minden megfigyelt értékesítő azonos súllyal szerepel.</p><ol>${rank.map(r=>`<li>${esc(r.title)} · ${level(r)}</li>`).join('')}</ol></details>`:'Még nincs beküldés.'}</div>${people.join('')}`;
}

const KEY=invitation?'toyota-invite-'+invitation:'toyota-observation-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(type=null){return {type,scores:Array(20).fill(null),seller:'',observer:'',date:new Date().toLocaleDateString('sv-SE'),notes:'',step:-1,done:false};}
function valid(s){return s&&Array.isArray(s.scores)&&s.scores.length===20&&s.scores.every(v=>v===null||[0,1,2].includes(v))&&['seller','observer','date','notes'].every(k=>typeof s[k]==='string')&&Number.isInteger(s.step)&&s.step>=-1&&(s.type==null||Object.hasOwn(exams,s.type))&&s.step<(exams[s.type]?.groups.length||5)&&typeof s.done==='boolean';}
let state=fresh(),storageOK=true;
try{const saved=preview?null:JSON.parse(localStorage.getItem(KEY));if(valid(saved)){
 if(!Object.hasOwn(saved,'type'))saved.type='fleet';
 state=saved;
 }}catch{storageOK=false;}
if(state.done&&state.scores.includes(null))state.done=false;
function count(){return state.scores.filter(v=>v!==null).length;}
function total(){return state.scores.reduce((a,b)=>a+(b??0),0);}
function save(){if(preview)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}const el=$('save');if(el)el.textContent=storageOK?'Automatikusan mentve ezen az eszközön.':'A böngésző nem engedi a mentést. A lap bezárása előtt töltsd le az eredményt.';}
function go(step){if(occasionLink&&step>=0&&!state.observer.trim()){alert("Add meg a saját neved.");return;}if(context&&step>=0&&!context.roster.includes(state.seller)){alert("Válassz értékesítőt a névsorból.");return;}state.step=step;state.done=false;save();render();window.scrollTo(0,0);}
function field(k,label,type='text'){return `<label>${label}<input id="${k}" type="${type}" value="${esc(state[k])}" maxlength="120"></label>`;}
function bindFields(){for(const k of ['seller','observer','notes'])if($(k))$(k).addEventListener('input',e=>{state[k]=e.target.value;save();});}
function bottom(){const n=count();$('bottom').innerHTML=`<div><div class="muted" aria-live="polite">${n} / 20 szempont értékelve</div><div class="progress"><span style="width:${n*5}%"></span></div><div class="actions">${state.step>=0?'<button class="secondary" id="prev">Vissza</button>':''}<button class="primary" id="next">${state.step<0?'Megfigyelés indítása':state.step===lastStep()?'Értékelés befejezése':state.type==='passenger'&&state.step===0?'Tovább az autóbemutatásra →':'Következő szakasz →'}</button></div><div class="status" id="save"></div></div>`;if($('prev'))$('prev').onclick=()=>go(state.step-1);$('next').onclick=()=>state.step===lastStep()?finish():go(state.step+1);save();}
let choosing=true;
function choose(){
 const resume=state.type ? '<button class="secondary" id="resume">'+esc(exam().name)+' · '+esc(state.seller||'Név nélkül')+' · '+(state.done?'Eredmény megnyitása':'Folytatás ('+count()+'/20)')+'</button>' : '';
 $('app').innerHTML='<h1>Melyik értékesítést figyeled meg?</h1><div class="panel"><div class="actions"><button class="primary" id="fleet">Flotta</button><button class="primary" id="passenger">Személyautó</button></div></div>'+(resume?'<div class="panel"><h2>Mentett megfigyelés</h2>'+resume+'</div>':'');
 $('app').insertAdjacentHTML('beforeend','<p><a href="#admin" onclick="setTimeout(()=>location.reload(),0)">Osztályok · adminbelépés</a></p>');
 if(resume)$('resume').onclick=()=>{choosing=false;render();};
 for(const type of Object.keys(exams))$(type).onclick=()=>{
  if(state.type&&!confirm('Az új megfigyelés felülírja a mentett megfigyelést. Folytatod?'))return;
  state=fresh(type);choosing=false;save();render();
 };
}
function render(){
 document.querySelector('#occasionBanner')?.remove();
 if(context){
  const b=document.createElement('div');b.id='occasionBanner';b.className='notice';
  b.textContent=[...(preview?['Megfigyelői előnézet']:[]),context.className,modeName(context.mode),context.occasion,state.observer?'Megfigyelő: '+state.observer:''].join(' · ');
  $('app').before(b);
 }
 if(choosing||!state.type){$('bottom').classList.add('hidden');choose();return;}
 $('bottom').classList.toggle('hidden',state.done);
 if(state.done){result();return;}
 if(state.step===-1){$('app').innerHTML=`<div class="eyebrow">${exam().name} · 20 szempont</div><h1>Figyeld meg.<br>Adj visszajelzést.</h1><p>${state.type==='fleet'?'Üzleti ügyfélszituáció és autóbemutatás.':'A lead felhívása és személyes autóbemutatás.'} Minden szempontnál jelöld, mit láttál a társad viselkedéséből.</p><div class="panel"><div class="fields">${context?`<label>Megfigyelt értékesítő<select id="seller"><option value="">Válassz a névsorból</option>${context.roster.map(name=>`<option ${name===state.seller?'selected':''}>${esc(name)}</option>`).join('')}</select></label>${occasionLink?field('observer','Saját neved (megfigyelő)'):''}`:field('seller','Megfigyelt értékesítő')+field('observer','Megfigyelő')}</div><p class="muted">${context?'Válaszd ki, kit figyelsz meg.':'Az adatok megadása nem kötelező.'}</p></div><div class="panel"><h2>Így pontozz</h2><p><b>0 · Nem látható</b><br>Nem jelenik meg, vagy nem éri el a célját.</p><p><b>1 · Részben látható</b><br>Érdemi, de hiányos megvalósítás.</p><p><b>2 · Rendben van</b><br>Önálló, ügyfélhez illő, megfelelő megvalósítás.</p><p class="muted">Minden szempont azonos súlyú. Maximum 40 pont.${context?.mode==='practice'?' Gyakorló megfigyelés.':' 25 ponttól megfelelt.'}</p></div><div class="notice">Mind a 20 szempontot a látott beszélgetés alapján értékeld. ${state.type==='fleet'?'Az első két pontnál is azt figyeld, mennyire látszik a felkészültség.':'A telefonon már megismert és a szalonban felhasznált információ is beszámít.'}</div><footer>${context?'A beküldött értékelést az osztály adminisztrátora látja.':'Ez az önálló értékelés a böngésződben marad.'}</footer>`;
 }else{const g=exam().groups[state.step];$('app').innerHTML=`<div class="eyebrow">${exam().name} · ${state.step+1}. szakasz / ${exam().groups.length}</div><h1>${g.name}</h1><nav class="nav" aria-label="Szakaszok">${exam().groups.map((g,i)=>`<button data-go="${i}" ${i===state.step?'aria-current="step"':''}>${i+1}. ${g.name}</button>`).join('')}</nav>${state.type==='fleet'&&state.step===0?'<div class="notice">A beszélgetésben látható felkészültséget értékeld: mit használ az értékesítő a cég és a partner ismeretéből, és mennyire átgondoltak a kérdései?</div>':''}<p class="muted">Érints meg egy pontszámot. A „Mit figyeljek?” alatt a megfigyelési útmutató segít.</p><div id="error" role="alert"></div>${exam().items.slice(g.start,g.end).map((it,j)=>{const i=g.start+j;return `<section class="card" id="card-${i}"><h3 id="title-${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(it.title)}</span></h3><details><summary>Mit figyeljek?</summary><p>${esc(it.help)}</p></details><div class="scores" role="group" aria-labelledby="title-${i}">${LABELS.map((l,v)=>`<button class="score" data-index="${i}" data-value="${v}" aria-pressed="${state.scores[i]===v}"><b>${v}</b>${l}</button>`).join('')}</div></section>`;}).join('')}${state.step===lastStep()?`<div class="panel"><label>Konkrét megfigyelés / visszajelzés<textarea id="notes" placeholder="Mit láttál vagy hallottál? Mi működött, min érdemes változtatni?">${esc(state.notes)}</textarea></label></div>`:''}`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));
 document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.index);state.scores[i]=Number(b.dataset.value);document.querySelectorAll(`[data-index="${i}"]`).forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.value)===state.scores[i]));save();bottom();});
 }bindFields();bottom();
}
function finish(){const missing=state.scores.findIndex(v=>v===null);if(missing!==-1){go(exam().groups.findIndex(g=>missing>=g.start&&missing<g.end));$('error').innerHTML=`<p class="error">Még ${20-count()} szempont hiányzik. Értékeld mind a 20-at az eredményhez.</p>`;$('card-'+missing).scrollIntoView({block:'center'});return;}state.date=new Date().toLocaleDateString('sv-SE');state.done=true;save();render();window.scrollTo(0,0);}
function report(){return [...(context?[context.className,modeName(context.mode)+' · '+context.occasion]:[]),'TOYOTA – '+exam().name+' – Megfigyelés és visszajelzés',`Értékesítő: ${state.seller||'–'}`,`Megfigyelő: ${state.observer||'–'}`,`Dátum: ${state.date}`,`Eredmény: ${total()}/40 – ${context?.mode==='practice'?'Gyakorlás':total()>=25?'Megfelelt':'Nem felelt meg'}`,context?.mode==='practice'?'':'Megfelelési határ: 25 pont.',breakdown(),state.sentAt?"Beküldés: "+new Date(state.sentAt).toLocaleString("hu-HU"):"",'',...exam().items.map((it,i)=>`${i+1}. ${it.title}: ${state.scores[i]}/2 – ${LABELS[state.scores[i]]}`),'','Konkrét megfigyelés / visszajelzés:',state.notes||'–'].join('\n');}
function result(){const score=total();$('app').innerHTML=`<div class="eyebrow">${exam().name} · Megfigyelés lezárva</div><div class="result ${score>=25?'pass':''}"><div>${esc(state.seller||'Az értékelés eredménye')}</div><h1>${score}<small> / 40 pont</small></h1><span class="badge">${context?.mode==='practice'?'Gyakorlás':score>=25?'Megfelelt':'Nem felelt meg'}</span>${breakdown()?`<p>${breakdown()}</p>`:''}<p ${context?.mode==='practice'?'hidden':''}>Megfelelési határ: 25 pont${score<25?` · Még ${25-score} pont szükséges.`:'.'}</p></div><p class="muted">${esc(state.date)} · Megfigyelő: ${esc(state.observer||'–')}</p><div class="noprint"><button class="primary" id="email" style="width:100%;margin-bottom:10px">Eredmény elküldése e-mailben · opcionális</button><p class="muted">A leveleződben megnyílik a teljes értékelés. Add meg a címzettet, majd küldd el. Ha nem nyílik meg, töltsd le az eredményt, és csatold a leveledhez.</p></div><div class="actions noprint"><button class="secondary" id="download">Eredmény letöltése</button><button class="secondary" id="print">Nyomtatás / PDF</button></div><div class="panel"><h2>Szempontonkénti eredmény</h2><ul class="rows">${exam().items.map((it,i)=>`<li><span><span class="num">${i+1}.</span> ${esc(it.title)}<br><small class="muted">${LABELS[state.scores[i]]}</small></span><b>${state.scores[i]} / 2</b></li>`).join('')}</ul></div><div class="panel"><h2>Konkrét visszajelzés</h2><p class="feedback">${esc(state.notes||'Nem került szöveges visszajelzés az értékeléshez.')}</p></div><div class="actions noprint"><button class="secondary" id="edit">Értékelés javítása</button><button class="primary" id="reset">Új megfigyelés</button></div><footer>Az új megfigyelés felülírja ezt a helyi értékelést. Előtte töltsd le, ha meg szeretnéd őrizni. A letöltés szövegfájlt készít; a Nyomtatás / PDF gomb a böngésző nyomtatási lehetőségeit nyitja meg.</footer>`;
 if(context){
  $('app').insertAdjacentHTML('afterbegin','<div class="panel noprint"><button class="primary" id="sendGroup"></button></div>');
  $('sendGroup').textContent=state.sent?'Beküldve'+(state.sentAt?' · '+new Date(state.sentAt).toLocaleString('hu-HU'):''):'Beküldés az osztályhoz';
  $('sendGroup').disabled=Boolean(state.sent);
  $('edit').hidden=Boolean(state.sent||state.startedSending);
  action('sendGroup',async()=>{
   if(preview){alert('Az előnézet végére értél. Az értékelés nem kerül az osztály eredményei közé.');return;}
   state.submission ||= crypto.randomUUID();state.startedSending=true;save();
   $('edit').hidden=true;
   const receipt=await api(occasionLink?'/rest/v1/rpc/submit_occasion_receipt':'/rest/v1/rpc/submit_observation',{...(occasionLink?{evaluator:state.observer.trim()}:{}),link:invitation,submission:state.submission,person:state.seller,marks:state.scores,feedback:state.notes});
   state.sentAt=typeof receipt==="string"?receipt:null;state.sent=true;save();render();
  });
 }
 $('email').onclick=()=>{const subject='Toyota '+exam().name+' – '+(state.seller||'Értékelés')+' – '+state.date;window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(report());};
 $('edit').onclick=()=>go(0);$('print').onclick=()=>window.print();$('download').onclick=()=>{const url=URL.createObjectURL(new Blob(['\ufeff'+report()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Toyota_'+exam().name+'_'+state.date+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};$('reset').onclick=()=>{if(!confirm('Új megfigyelést kezdesz? A jelenlegi értékelés helyi példánya törlődik. Előtte töltsd le, ha meg szeretnéd őrizni.'))return;state=fresh(context?.kind||null);if(context)state.observer=context.observer||'';choosing=!context;save();render();window.scrollTo(0,0);};
}
startApp();
</script></body></html>
