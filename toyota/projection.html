<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toyota · Közös eredmények</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#213334;background:#f2f3ef;font-synthesis:none;--ink:#213334;--muted:#687775;--green:#287f70;--amber:#b86b40;--rose:#bc5966;--slate:#a3b0b1}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #23796c;outline-offset:4px}
.shell{max-width:1600px;margin:auto;padding:32px 52px 24px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8dfda;padding-bottom:20px;gap:30px}.brand{display:flex;align-items:center;gap:14px}.brand b{color:#d9091c;letter-spacing:1px;font-size:18px}.brand span{border-left:1px solid #cbd4ce;padding-left:14px;font-size:13px;letter-spacing:.6px;color:var(--muted)}.context{text-align:right;font-size:14px;color:var(--muted);line-height:1.6}.context strong{color:var(--ink);font-weight:600}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:28px 0 24px}.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(25px,2.6vw,39px);font-weight:600;letter-spacing:-1.1px;line-height:1.16;margin:9px 0 0}h2{font-size:23px;font-weight:600;margin:0;letter-spacing:-.5px}p{line-height:1.55}.meta{display:flex;gap:20px;flex-shrink:0;font-size:14px;color:var(--muted)}.meta b{color:var(--ink);font-weight:600}.main{flex:1}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:#fff;border:1px solid #dce3dd;border-radius:20px;overflow:hidden;box-shadow:0 6px 25px #21333404}.card-head{padding:24px 28px 20px;border-bottom:1px solid #edf0eb;display:flex;align-items:center;gap:12px}.marker{width:9px;height:9px;border-radius:50%;background:var(--green)}.develop .marker{background:var(--amber)}.card-head small{display:block;color:var(--muted);font-size:13px;margin-top:5px}.rank-list{padding:2px 28px 10px}.rank-item{padding:20px 0;border-bottom:1px solid #edf0eb;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start}.rank-item:last-child{border:0}.rank-number{font-size:12px;color:#91a09a;margin-top:5px}.rank-title{font-size:19px;font-weight:500;line-height:1.4}.rank-score{font-size:25px;letter-spacing:-.7px;color:var(--green);font-weight:600;white-space:nowrap}.rank-score small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}.develop .rank-score{color:var(--amber)}.mini-track{height:4px;border-radius:9px;background:#edf0eb;margin-top:12px;overflow:hidden}.mini-track i{display:block;height:100%;background:var(--green);border-radius:9px}.develop .mini-track i{background:var(--amber)}.ties{font-size:12px;color:var(--muted);padding:0 28px 16px;margin:0}
.legend{display:flex;gap:20px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 20px}.legend span{display:flex;gap:7px;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rose)}.dot.one{background:var(--slate)}.dot.two{background:var(--green)}
.distribution{padding:8px 26px}.distribution-head,.distribution-row{display:grid;grid-template-columns:32px minmax(210px,1.05fr) minmax(210px,1fr) 80px;align-items:center;gap:18px}.distribution-head{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:15px 0;border-bottom:1px solid #e4e9e3}.distribution-row{min-height:49px;padding:11px 0;border-bottom:1px solid #edf0eb;font-size:15px;line-height:1.3}.distribution-row:last-child{border:0}.distribution-row .idx{font-size:12px;color:#8b9b95}.mean{text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}.mean small{font-size:12px;color:var(--muted);font-weight:400}.stack{height:25px;display:flex;overflow:hidden;border-radius:6px;background:#edf0eb}.segment{display:flex;align-items:center;justify-content:center;min-width:0;background:var(--rose);color:#fff;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.segment.one{background:var(--slate);color:#213334}.segment.two{background:var(--green)}.count-line{display:flex;gap:16px;color:var(--muted);font-size:12px;margin-top:7px}
.single{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:24px}.criterion-info{padding:30px 34px;position:relative}.criterion-info .number{display:inline-block;border:1px solid #d8e3dc;border-radius:9px;padding:8px 12px;color:var(--green);font-size:14px;letter-spacing:1px;margin-bottom:20px}.criterion-info h2{font-size:clamp(24px,2.8vw,37px);line-height:1.2;max-width:650px}.criterion-info p{font-size:18px;color:#60716c;max-width:650px;margin-top:25px;line-height:1.65}.single-score{padding:30px 32px}.single-score .value{font-size:76px;letter-spacing:-5px;line-height:1.05;color:var(--green);font-weight:500;margin:20px 0 8px}.single-score .value small{font-size:24px;letter-spacing:-.5px;color:var(--muted)}.single-score .stack{height:34px;margin-top:28px}.single-score .segment{font-size:15px}.single-counts{display:grid;gap:15px;margin-top:24px}.single-counts div{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted)}.single-counts b{font-size:20px;color:var(--ink);font-weight:500}.single-counts .dot{margin-right:8px}
.note{padding:14px 18px;background:#e7eee8;border:1px solid #d4e0d5;border-radius:10px;font-size:14px;color:#4a655a;margin:0 0 20px}.footer{display:flex;justify-content:space-between;align-items:center;gap:25px;border-top:1px solid #d8dfda;margin-top:28px;padding-top:16px;color:var(--muted);font-size:11px;line-height:1.5}.live{display:flex;gap:8px;align-items:center;white-space:nowrap}.live i{width:6px;height:6px;border-radius:50%;background:var(--green)}.live.paused i{background:var(--amber)}.empty{display:grid;place-content:center;text-align:center;min-height:380px;color:var(--muted)}.empty h2{color:var(--ink)}.utility{position:fixed;bottom:9px;right:12px;border:1px solid #d7dfd9;background:#ffffffd9;border-radius:8px;font-size:11px;padding:6px 10px;color:#63746c;opacity:.2}.utility:hover,.utility:focus-visible{opacity:1}
@media(min-width:1500px){.rank-item{padding:25px 0}.rank-title{font-size:21px}.distribution-row{min-height:58px;font-size:17px}}
@media(max-width:1000px){.shell{padding:24px 28px}.heading{align-items:start}.meta{display:block;line-height:1.7}.cards,.single{gap:16px}.rank-list{padding:0 20px}.rank-item{gap:7px}.rank-title{font-size:17px}.rank-score{font-size:22px}.card-head{padding:20px}.distribution{padding:6px 18px}.distribution-row,.distribution-head{gap:10px;grid-template-columns:26px minmax(180px,1fr) minmax(170px,1fr) 60px}.single-score .value{font-size:64px}}
@media print{.utility{display:none}.shell{padding:0}.card{box-shadow:none;break-inside:avoid}}
.name-strip{display:flex;align-items:baseline;gap:22px;padding:18px 22px;border:1px solid #dce3dd;background:#fff;border-radius:12px;margin-top:20px;font-size:14px;line-height:1.7}.name-strip b{font-size:12px;color:var(--muted);white-space:nowrap}.named-results{margin-top:24px}.named-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;padding:6px 28px 15px}.named-person{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid #edf0eb;font-size:15px;line-height:1.5}.named-person>b{font-weight:500}.named-person>div{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}.named-score{display:flex;flex-direction:column;text-align:right}.named-score strong{color:var(--green);font-weight:600}.named-score>span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="shell" id="screen"><div class="empty"><div class="eyebrow">Toyota · Közös eredmények</div><h2>A kivetítés előkészítése</h2><p>Válassz nézetet az adminfelületen.</p></div></main>
<button class="utility" id="full">Teljes képernyő</button>
<script>
'use strict';
const screen=document.getElementById('screen');
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=n=>n.toLocaleString('hu-HU',{maximumFractionDigits:2});
function segments(counts){
 const total=counts.reduce((a,b)=>a+b,0);
 return '<div class="stack">'+counts.map((count,i)=>count?'<span class="segment '+(['zero','one','two'][i])+'" style="width:'+count/total*100+'%" title="'+i+' pont · '+count+' értékelés">'+count+'</span>':'').join('')+'</div>';
}
function legend(){return '<div class="legend"><span><i class="dot"></i>0 · Nem látható</span><span><i class="dot one"></i>1 · Részben látható</span><span><i class="dot two"></i>2 · Rendben van</span></div>';}
function highlights(data){
 const ranked=[...data.items].sort((a,b)=>b.mean-a.mean||a.index-b.index);
 const equal=Math.abs(ranked[0].mean-ranked.at(-1).mean)<1e-9;
 const group=(title,rows,style)=>{
 const boundary=rows.at(-1).mean,extra=ranked.filter(r=>Math.abs(r.mean-boundary)<1e-9&&!rows.includes(r)).length;
 return '<section class="card '+style+'"><div class="card-head"><i class="marker"></i><div><h2>'+title+'</h2><small>'+(style==='develop'?'A legalacsonyabb átlagú szempontok':'A legmagasabb átlagú szempontok')+'</small></div></div><div class="rank-list">'+rows.map((r,i)=>'<div class="rank-item"><span class="rank-number">'+String(r.index+1).padStart(2,'0')+'</span><div><div class="rank-title">'+safe(r.title)+'</div><div class="mini-track"><i style="width:'+r.mean*50+'%"></i></div></div><span class="rank-score">'+number(r.mean)+'<small> / 2</small></span></div>').join('')+'</div>'+(extra?'<p class="ties">További '+extra+' szempont ugyanilyen határértékkel.</p>':'')+'</section>';
 };
 if(equal)return '<div class="note">Mind a 20 szempont átlaga azonos · '+number(ranked[0].mean)+' / 2. Az átlagok alapján most nincs elkülönülő erősség vagy fejlesztendő terület.</div><section class="card distribution">'+legend()+ranked.slice(0,3).map(r=>'<p>'+safe(r.title)+' · '+number(r.mean)+' / 2</p>').join('')+'<p class="muted">A megoszlás nézetben látható, milyen pontokból alakult ki az átlag.</p></section>';
 return '<div class="cards">'+group('Erősségek',ranked.slice(0,3),'strength')+group('Fejlesztendők',[...ranked].sort((a,b)=>a.mean-b.mean||a.index-b.index).slice(0,3),'develop')+'</div>';
}
function distribution(data){
 const items=data.items.slice(data.page*10,data.page*10+10);
 return legend()+'<section class="card distribution"><div class="distribution-head"><span>#</span><span>Megfigyelési szempont</span><span>Pontok megoszlása · darabszám</span><span style="text-align:right">Átlag</span></div>'+items.map(r=>'<div class="distribution-row"><span class="idx">'+String(r.index+1).padStart(2,'0')+'</span><span>'+safe(r.title)+'</span>'+segments(r.counts)+'<span class="mean">'+number(r.mean)+'<small> / 2</small></span></div>').join('')+'</section>';
}
function single(data){
 const r=data.items[data.selected];
 return '<div class="single"><section class="card criterion-info"><span class="number">SZEMPONT '+String(r.index+1).padStart(2,'0')+' / 20</span><h2>'+safe(r.title)+'</h2><p>'+safe(r.help)+'</p></section><section class="card single-score"><div class="eyebrow">'+(data.scope==='person'?'Egyéni átlag':'Osztályátlag')+'</div><div class="value">'+number(r.mean)+'<small> / 2</small></div>'+segments(r.counts)+'<div class="single-counts">'+r.counts.map((n,i)=>'<div><span><i class="dot '+(['zero','one','two'][i])+'"></i>'+safe(['Nem látható','Részben látható','Rendben van'][i])+'</span><b>'+n+'</b></div>').join('')+'</div></section></div>';
}
function namesPanel(data){
 if(!data.showNames||!Array.isArray(data.namedRecords)||!data.namedRecords.length)return '';
 if(data.view!=='single')return '<div class="name-strip"><b>Értékelt résztvevők</b><span>'+[...new Set(data.namedRecords.map(r=>r.seller))].map(safe).join(' · ')+'</span></div>';
 return '<section class="card named-results"><div class="card-head"><div><h2>Egyéni értékelések</h2><small>A kiválasztott szempontra adott pontok</small></div></div><div class="named-grid">'+[...new Set(data.namedRecords.map(r=>r.seller))].map(name=>'<div class="named-person"><b>'+safe(name)+'</b><div>'+data.namedRecords.filter(r=>r.seller===name).map(r=>'<span class="named-score"><strong>'+r.scores[data.selected]+' / 2</strong><span>'+safe(r.observer)+'</span></span>').join('')+'</div></div>').join('')+'</div></section>';
}
function render(data){
 const titles={highlights:'Erősségek és fejlesztendők',single:'Egy szempont közelebbről',distribution:'Milyen pontok érkeztek?'};
 const body=data.submissions?(data.view==='single'?single(data):data.view==='distribution'?distribution(data):highlights(data)):'<section class="card empty"><h2>Még nincs beküldött értékelés</h2><p>Az összesítés az első beküldés után jelenik meg.</p></section>';
 screen.innerHTML='<header class="top"><div class="brand"><b>TOYOTA</b><span>KÖZÖS EREDMÉNYEK</span></div><div class="context"><strong>'+safe(data.className)+'</strong><br>'+(data.scope==='person'?'<strong>'+safe(data.subject)+'</strong> · ':'')+safe(data.kind)+' · '+safe(data.mode)+' · '+safe(data.occasion)+'</div></header><div class="heading"><div><div class="eyebrow">'+(data.view==='distribution'?'Szempontok '+(data.page*10+1)+'–'+Math.min(data.page*10+10,20)+' / 20':(data.subject||'Teljes osztály'))+'</div><h1>'+titles[data.view]+'</h1></div><div class="meta"><span><b>'+data.observed+' / '+data.people+'</b> értékesítő</span><span><b>'+data.submissions+'</b> értékelés</span></div></div><div class="main">'+body+namesPanel(data)+'</div><footer class="footer"><span>'+(data.scope==='person'?'Átlagok · a résztvevőről kapott értékelések':'Átlagok · értékesítőnként azonos súly')+' &nbsp; / &nbsp; Megoszlás · minden beküldött értékelés</span><span class="live '+(data.frozen?'paused':'')+'"><i></i>'+(data.frozen?'Kimerevítve':'Frissítve')+' · '+safe(data.updated)+'</span></footer>';
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.opener||event.data?.type!=='toyota-projection-data')return;
 const data=event.data.payload;
 if(!data||!['highlights','single','distribution'].includes(data.view)||!Array.isArray(data.items)||data.items.length!==20)return;
 render(data);
});
document.getElementById('full').onclick=async()=>{
 try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}
};
function ready(){if(window.opener)window.opener.postMessage({type:'toyota-projection-ready'},location.origin);}
ready();
window.addEventListener('pageshow',ready);
</script>
</body>
</html>
