# main is the single source of truth for Kreditjatek
name: Kreditjatek build and publish

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/kreditjatek.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kreditjatek-main
  cancel-in-progress: true

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Test
        working-directory: app
        run: npm test

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules audit
        working-directory: app
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-kreditjatek-rules "npm run test:rules"

      - name: Production dependency audit
        working-directory: app
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: app
        run: npm run build

      - name: Publish dashboard
        run: |
          rm -rf dashboard
          mkdir -p dashboard
          cp -R app/dist/. dashboard/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard
          if git diff --cached --quiet; then
            echo "Dashboard already current."
          else
            git commit -m "Publish Kreditjatek dashboard"
            git push origin main
          fi
