name: Firebase E2E audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-e2e-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Run Firebase auth and Firestore permission audit
        shell: bash
        run: |
          set -uo pipefail
          API_KEY='AIzaSyAh623-RLDVDkBWFQp6X-F1xBeNi8tLu2Y'
          PROJECT='kreditjatek-a644e'
          BASE="https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents"
          CODE="AU$(date +%H%M%S)"
          CODE="${CODE:0:6}"

          auth() {
            local raw body status
            raw=$(curl -sS -w $'\n%{http_code}' -X POST \
              "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{"returnSecureToken":true}')
            status=$(printf '%s' "$raw" | tail -n1)
            body=$(printf '%s' "$raw" | sed '$d')
            printf '%s\n' "$status"
            printf '%s' "$body" | jq -r '.localId // ""'
            printf '%s' "$body" | jq -r '.idToken // ""'
          }

          echo "=== AUTH trainer ==="
          mapfile -t A1 < <(auth)
          echo "status=${A1[0]} uid_present=$([ -n "${A1[1]}" ] && echo yes || echo no) token_present=$([ -n "${A1[2]}" ] && echo yes || echo no)"
          TRAINER_UID="${A1[1]}"; TRAINER_TOKEN="${A1[2]}"

          echo "=== AUTH player ==="
          mapfile -t A2 < <(auth)
          echo "status=${A2[0]} uid_present=$([ -n "${A2[1]}" ] && echo yes || echo no) token_present=$([ -n "${A2[2]}" ] && echo yes || echo no)"
          PLAYER_UID="${A2[1]}"; PLAYER_TOKEN="${A2[2]}"
          PLAYER_ID=$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )

          req() {
            local label method url token data raw status body
            label="$1"; method="$2"; url="$3"; token="$4"; data="${5-}"
            if [ -n "$data" ]; then
              raw=$(curl -sS -w $'\n%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer $token" \
                -H 'Content-Type: application/json' \
                -d "$data")
            else
              raw=$(curl -sS -w $'\n%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer $token")
            fi
            status=$(printf '%s' "$raw" | tail -n1)
            body=$(printf '%s' "$raw" | sed '$d')
            msg=$(printf '%s' "$body" | jq -r '.error.status // .error.message // "OK"' 2>/dev/null || echo "UNPARSEABLE")
            echo "$label status=$status result=$msg"
          }

          GAME_BODY=$(jq -nc --arg uid "$TRAINER_UID" --arg code "$CODE" '{
            fields:{
              trainerUid:{stringValue:$uid},
              status:{stringValue:"lobby"},
              roundKey:{stringValue:"lobby"},
              session:{mapValue:{fields:{roundKey:{stringValue:"lobby"}}}},
              code:{stringValue:$code}
            }}')
          PUBLIC_BODY=$(jq -nc --arg uid "$TRAINER_UID" '{
            fields:{
              trainerUid:{stringValue:$uid},
              status:{stringValue:"lobby"},
              roundKey:{stringValue:"lobby"},
              expectedPlayerCount:{integerValue:"12"},
              joinedCount:{integerValue:"0"},
              createdAt:{stringValue:"audit"}
            }}')

          echo "=== TRAINER creates minimal lobby ==="
          req game_create PATCH "$BASE/games/$CODE" "$TRAINER_TOKEN" "$GAME_BODY"
          req public_create PATCH "$BASE/publicGames/$CODE" "$TRAINER_TOKEN" "$PUBLIC_BODY"

          echo "=== PLAYER reads public lobby ==="
          req public_get GET "$BASE/publicGames/$CODE" "$PLAYER_TOKEN"

          PLAYER_BODY_RANDOM=$(jq -nc --arg pid "$PLAYER_ID" --arg uid "$PLAYER_UID" '{
            fields:{
              playerId:{stringValue:$pid},
              authUid:{stringValue:$uid},
              name:{stringValue:"Audit Player Random"},
              joinedAt:{stringValue:"audit"},
              lastSeenAt:{timestampValue:"2026-09-21T17:03:07Z"},
              commands:{mapValue:{fields:{}}}
            }}')
          PLAYER_BODY_UID=$(jq -nc --arg pid "$PLAYER_UID" --arg uid "$PLAYER_UID" '{
            fields:{
              playerId:{stringValue:$pid},
              authUid:{stringValue:$uid},
              name:{stringValue:"Audit Player UID"},
              joinedAt:{stringValue:"audit"},
              lastSeenAt:{timestampValue:"2026-09-21T17:03:07Z"},
              commands:{mapValue:{fields:{}}}
            }}')

          echo "=== PLAYER create using random document id (old working model) ==="
          req player_create_random PATCH "$BASE/games/$CODE/players/$PLAYER_ID" "$PLAYER_TOKEN" "$PLAYER_BODY_RANDOM"

          echo "=== PLAYER create using auth uid as document id (current attempted model) ==="
          req player_create_uid PATCH "$BASE/games/$CODE/players/$PLAYER_UID" "$PLAYER_TOKEN" "$PLAYER_BODY_UID"

          echo "=== PLAYER own document reads ==="
          req player_get_random GET "$BASE/games/$CODE/players/$PLAYER_ID" "$PLAYER_TOKEN"
          req player_get_uid GET "$BASE/games/$CODE/players/$PLAYER_UID" "$PLAYER_TOKEN"

          echo "=== TRAINER writes participant view field ==="
          VIEW_BODY=$(jq -nc '{fields:{view:{mapValue:{fields:{code:{stringValue:"AUDIT"}}}}}}')
          req trainer_view_random PATCH "$BASE/games/$CODE/players/$PLAYER_ID?updateMask.fieldPaths=view" "$TRAINER_TOKEN" "$VIEW_BODY"
          req trainer_view_uid PATCH "$BASE/games/$CODE/players/$PLAYER_UID?updateMask.fieldPaths=view" "$TRAINER_TOKEN" "$VIEW_BODY"

          echo "=== PLAYER updates lastSeenAt only ==="
          PING_BODY=$(jq -nc '{fields:{lastSeenAt:{stringValue:"audit2"}}}')
          req player_ping_random PATCH "$BASE/games/$CODE/players/$PLAYER_ID?updateMask.fieldPaths=lastSeenAt" "$PLAYER_TOKEN" "$PING_BODY"
          req player_ping_uid PATCH "$BASE/games/$CODE/players/$PLAYER_UID?updateMask.fieldPaths=lastSeenAt" "$PLAYER_TOKEN" "$PING_BODY"

          echo "=== cleanup ==="
          req delete_random DELETE "$BASE/games/$CODE/players/$PLAYER_ID" "$TRAINER_TOKEN"
          req delete_uid DELETE "$BASE/games/$CODE/players/$PLAYER_UID" "$TRAINER_TOKEN"
          req delete_public DELETE "$BASE/publicGames/$CODE" "$TRAINER_TOKEN"
          req delete_game DELETE "$BASE/games/$CODE" "$TRAINER_TOKEN"
