name: Omotenashi notebook checks
on:
  push:
    branches: [main]
    paths:
      - 'omotenashi/**'
      - '.github/workflows/omotenashi.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omotenashi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test runtime
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify notes, offline reopen and update
        env:
          OMOTENASHI_APP_DIR: ${{ github.workspace }}/omotenashi
        run: node omotenashi/tests/smoke.mjs
      - name: Save test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omotenashi-notebook-checks
          path: build/omotenashi_qa
          if-no-files-found: ignore
