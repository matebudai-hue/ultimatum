name: Toyota observation checks
on:
  push:
    paths: ['toyota/**', '.github/workflows/toyota.yml']
  pull_request:
    paths: ['toyota/**', '.github/workflows/toyota.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find toyota -name '*.js' -exec node --check {} \;
      - run: node --test toyota/tests/review.test.cjs
